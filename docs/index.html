<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip Rush">
<meta name="theme-color" content="#0b0d11">
<meta name="description" content="Buy under market. Sell into the hype. Make rent before the bell.">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Flip Rush</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a full-screen top-down town on a canvas with a floating HUD; buildings open full-screen rooms (market, gym, home, cafe, mall, arena, trading and more). */
:root{
  --bg:#eceef2; --surface:#ffffff; --sunk:#e2e5ea; --ink:#0d1015; --muted:#677080; --line:#d8dce3;
  --accent:#2a3cff; --accent-ink:#ffffff; --up:#08965a; --down:#df2f45; --gold:#b97c00;
  --tl:.93; --tc:.05; --tt:.38; --shadow:0 1px 0 rgba(13,16,21,.04),0 8px 24px -12px rgba(13,16,21,.18);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d11; --surface:#14171d; --sunk:#1b1f27; --ink:#eff2f6; --muted:#8a93a4; --line:#242a34;
  --accent:#6d7bff; --accent-ink:#0b0d11; --up:#2fd28a; --down:#ff5b6e; --gold:#ffc24a;
  --tl:.31; --tc:.06; --tt:.86; --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d11; --surface:#14171d; --sunk:#1b1f27; --ink:#eff2f6; --muted:#8a93a4; --line:#242a34;
  --accent:#6d7bff; --accent-ink:#0b0d11; --up:#2fd28a; --down:#ff5b6e; --gold:#ffc24a;
  --tl:.31; --tc:.06; --tt:.86; --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,.lst:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Header */
.top{display:flex;flex-direction:column;gap:8px}
.row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cash{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:800;font-size:2.5rem;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .25s}
.cash.gain{color:var(--up)} .cash.spend{color:var(--ink)}
.right{display:flex;align-items:center;gap:8px}
.daypill{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.daypill .clk{color:var(--muted)} .daypill.low .clk{color:var(--down)}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.iconbtn svg{width:16px;height:16px}
.clock{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.clock i{display:block;height:100%;background:var(--ink);transform-origin:left;width:100%}
.clock.low i{background:var(--down)}
.rentline{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
.rentline b{color:var(--ink);font-family:var(--mono);font-weight:600}
.rentbar{flex:1;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.rentbar i{display:block;height:100%;width:0;background:var(--down);border-radius:6px;transition:width .3s,background .3s}
.rentbar.ok i{background:var(--up)}
#rentState{font-family:var(--mono);font-weight:600;min-width:9ch;text-align:right}

/* News */
.news{display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;font-size:.8rem}
.live{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--down);display:flex;align-items:center;gap:5px;flex:none}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#news{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#news.in{animation:slidein .35s ease-out}
#news b.u{color:var(--up)} #news b.d{color:var(--down)}
@keyframes slidein{from{transform:translateY(100%);opacity:0}}

.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sechead h3{margin:0;font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:.95rem;letter-spacing:-.01em;text-transform:uppercase}
.sechead .eyebrow{margin-left:auto;letter-spacing:.06em;text-transform:none;font-size:.72rem}

/* Tiles */
.tile{--h:250;flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:oklch(var(--tl) var(--tc) var(--h));color:oklch(var(--tt) .13 var(--h));font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:.95rem;letter-spacing:-.02em}
.tile.sm{width:34px;height:34px;border-radius:8px;font-size:.78rem}

/* Listings */
.market{display:flex;flex-direction:column;gap:6px}
.lst{position:relative;height:62px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px 0 9px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;touch-action:none}
.lst .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lst .nm{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .sub{display:flex;gap:7px;align-items:center;font-size:.72rem;color:var(--muted);white-space:nowrap}
.cond{font-family:var(--mono);font-size:.62rem;font-weight:600;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.disc{font-family:var(--mono);font-weight:600;color:var(--up)}
.disc.neg{color:var(--down)}
.ask{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:72px}
.pr{font-family:var(--mono);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.act{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--ink);color:var(--bg)}
.lst .life{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.lst .life i{display:block;height:100%;background:var(--muted);opacity:.5;transform-origin:left}
.lst.steal .act{background:var(--gold);color:#1b1200}
.lst.steal .life i{background:var(--gold);opacity:1}
.lst .tag{display:none;font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.08em;color:var(--gold)}
.lst.steal .tag{display:inline}
.lst.broke .pr{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.lst.broke .act{background:var(--sunk);color:var(--muted)}
.lst.hag{--risk:0;animation:jit .09s infinite alternate}
.lst.hag .act{background:var(--accent);color:var(--accent-ink)}
.lst.hag .pr{color:var(--accent)}
.lst.hag::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--accent);opacity:calc(.4 + var(--risk))}
@keyframes jit{from{transform:translateX(calc(var(--risk) * -3px))}to{transform:translateX(calc(var(--risk) * 3px))}}
.lst.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lst.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line);justify-content:center;color:var(--muted);font-size:.78rem;cursor:default}
.lst.empty .shim{width:40%;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:shim 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.lst.walked{background:transparent;box-shadow:inset 0 0 0 1px var(--down);justify-content:center;color:var(--down);font-size:.8rem;font-weight:600;cursor:default}
.lst.fresh{animation:drop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-8px) scale(.98);opacity:0}}

/* Collector */
.collector{height:52px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px 0 9px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:.8rem}
.collector.on{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow);background:var(--surface);color:var(--ink);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 4px color-mix(in oklab,var(--gold) 22%,transparent)}}
.collector .ct{flex:1;min-width:0;line-height:1.3}
.collector .ct b{font-weight:700}
.collector .mult{font-family:var(--mono);font-weight:700;color:var(--gold)}
.ring{--p:1;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*360deg),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring span{width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;font-weight:700}

/* Stash */
.stashsec{flex:1;min-height:0;display:flex;flex-direction:column}
.streak{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.streak i{display:block;width:34px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.streak i::after{content:"";display:block;height:100%;width:calc(var(--s,0)*100%);background:var(--accent)}
.stash{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;padding-bottom:6px;scrollbar-width:none}
.stash::-webkit-scrollbar{display:none}
.itm{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:6px 10px;padding:10px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);min-width:0;transition:transform .08s}
.itm:active{transform:scale(.97)}
.itm .iv{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.bid{font-family:var(--mono);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.pl{font-family:var(--mono);font-size:.7rem;font-weight:600}
.itm.up .pl{color:var(--up)} .itm.down .pl{color:var(--down)}
.inm{grid-column:1/-1;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{grid-column:1/-1;width:100%;height:22px;display:block}
.spark path.l{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.itm.up .spark{color:var(--up)} .itm.down .spark{color:var(--down)}
.spark path.l{stroke:currentColor} .spark path.a{fill:currentColor;opacity:.12}
.itm .hc{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#1b1200;background:var(--gold);padding:2px 6px;border-radius:99px;display:none}
.itm.hot{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}
.itm.hot .hc{display:block}
.itm.new{animation:drop .3s cubic-bezier(.2,.9,.3,1.2)}
.slot0{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--muted);font-size:.72rem;min-height:104px}

/* FX */
.float{position:fixed;pointer-events:none;z-index:40;font-family:var(--mono);font-weight:700;font-size:1.15rem;animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.float small{display:block;font-size:.62rem;letter-spacing:.08em;text-align:center}
@keyframes rise{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{transform:translate(-50%,-8px) scale(1.1);opacity:1}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.banner{position:fixed;left:50%;top:38%;z-index:41;pointer-events:none;font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:2.4rem;letter-spacing:-.03em;text-transform:uppercase;color:var(--ink);white-space:nowrap;animation:ban 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.banner.g{color:var(--gold)} .banner.a{color:var(--accent)}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(1.6);opacity:0;filter:blur(6px)}18%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:none}75%{opacity:1}100%{transform:translate(-50%,-60%);opacity:0}}

/* Overlay screens */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;overflow-y:auto;padding-inline:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.sheet{width:100%;max-width:420px;margin:auto 0;display:flex;flex-direction:column;gap:18px;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.wordmark{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:clamp(4rem,22vw,6.2rem);line-height:.82;letter-spacing:-.055em;margin:0}
.wordmark span{display:block;color:var(--accent)}
.lede{font-size:1.05rem;line-height:1.45;color:var(--muted);margin:0;max-width:30ch}
.how{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.how div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;font-size:.86rem;line-height:1.35}
.how div+div{border-top:1px solid var(--line)}
.how kbd{font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.06em;padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);min-width:44px;text-align:center}
.cta{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.15rem;text-transform:uppercase;letter-spacing:-.01em;padding:18px 20px;border-radius:14px;transition:transform .1s}
.cta:active{transform:scale(.98)}
.cta svg{width:22px;height:22px}
.fine{font-size:.76rem;color:var(--muted);text-align:center;margin:0}
.h2{font-family:var(--display);font-variation-settings:"wdth" 120;font-weight:900;font-size:2.4rem;line-height:.9;letter-spacing:-.04em;margin:0;text-transform:uppercase}
.h2 small{display:block;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.stmt{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 16px;font-size:.88rem}
.stmt div{display:flex;justify-content:space-between;padding:9px 0}
.stmt div+div{border-top:1px dashed var(--line)}
.stmt span:last-child{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.stmt .tot{font-weight:700;font-size:1rem}
.stmt .pos{color:var(--up)} .stmt .neg{color:var(--down)}
.perks{display:flex;flex-direction:column;gap:6px}
.perk{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.perk .t{font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.pips{display:flex;gap:3px}.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--accent)}
.perk .d{font-size:.76rem;color:var(--muted)}
.perk .c{grid-row:1/3;grid-column:2;font-family:var(--mono);font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.perk[disabled]{box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.perk[disabled] .c{background:var(--sunk);color:var(--muted)}
.perk.bought{animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.02)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 div{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.grid2 b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:700;margin-top:4px}
.rank{font-family:var(--display);font-variation-settings:"wdth" 110;font-weight:800;font-size:1.1rem;color:var(--accent)}
/* Goals, events, special listings */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.goal{display:flex;align-items:center;justify-content:space-between;gap:6px;height:28px;padding:0 9px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);font-size:.68rem;font-weight:600;color:var(--muted);min-width:0}
.goal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.goal b{font-family:var(--mono);color:var(--ink);flex:none;font-size:.66rem}
.goal.done{background:color-mix(in oklab,var(--up) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--up);color:var(--up)}
.goal.done b{color:var(--up)}
.goal.pop{animation:pulse .45s}
.lst .nm{display:flex;gap:8px;align-items:baseline}
.lst .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sel{flex:none;font-family:var(--mono);font-size:.62rem;font-weight:600;color:var(--muted)}
.sel.bad{color:var(--down)}
.fk{font-family:var(--mono);font-size:.58rem;font-weight:700;color:#fff;background:var(--down);padding:1px 5px;border-radius:4px}
.tile.mys{background:linear-gradient(135deg,var(--gold),color-mix(in oklab,var(--gold) 45%,var(--accent)));color:#1b1200;font-size:1.35rem}
.lst.grail{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 4px color-mix(in oklab,var(--gold) 25%,transparent),var(--shadow)}
.lst.grail .tag{display:inline}
.lst.grail .act,.lst.mys .act{background:var(--gold);color:#1b1200}
.collector{position:relative;overflow:hidden;height:auto;min-height:56px}
.collector.offer,.collector.auction{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.collector.auction{animation:glowA 1s infinite alternate}
@keyframes glowA{to{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent)}}
.evbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left}
.ebtn{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-radius:10px;flex:none;white-space:nowrap}
.ebtn.go{background:var(--accent);color:var(--accent-ink)}
.ebtn.ghost{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.ebtn[disabled]{opacity:.4}
.btns{display:flex;gap:6px}
.collector .ct .l1,.collector .ct .l2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{color:var(--muted)} .who.bad{color:var(--down);font-weight:700}
.lead-you{color:var(--up);font-weight:700} .lead-rival{color:var(--down);font-weight:700}
.itm .fc{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#fff;background:var(--down);padding:2px 6px;border-radius:99px}
.banner.r{color:var(--down)}
.modchip{font-family:var(--mono);font-size:.64rem;font-weight:700;color:var(--accent);padding:3px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--accent);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.mods{display:grid;gap:8px}
.modcard{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);transition:transform .1s}
.modcard:active{transform:scale(.98)}
.modcard .mt{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:-.01em}
.modcard .md{font-size:.84rem;color:var(--muted);line-height:1.4}
.modcard .mg{margin-top:6px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.modcard .mg svg{width:14px;height:14px}
.note{font-size:.86rem;line-height:1.4;padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.note b{color:var(--accent)}
.rep{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rep .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.78rem;color:var(--muted)}
.rep .lv{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1rem;color:var(--ink);text-transform:uppercase}
.repbar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.repbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.stmt .ok{color:var(--up)} .stmt .miss{color:var(--muted)}
@media (max-height:700px){#app{gap:8px}.goal{height:24px}.lst{height:54px}.tile{width:38px;height:38px}.cash{font-size:2.1rem}}
/* World */
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;z-index:10;max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:9px 12px}
.hudtop{display:flex;align-items:stretch;gap:8px}
.cashchip{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cashchip .cash{font-size:1.75rem}
.cashchip .mult{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--gold)}
.timechip{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;font-family:var(--mono);font-size:.72rem;font-weight:600}
.timechip span{color:var(--muted);font-size:.64rem}
.stats{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:5px;min-width:0}
.stat small{display:flex;justify-content:space-between;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat small b{font-family:var(--mono);color:var(--ink);letter-spacing:0}
.bar{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;transition:width .25s}
.bar.en i{background:var(--up)} .bar.en.low i{background:var(--down)} .bar.xp i{background:var(--accent)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:480px;margin:0 auto;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bottom>*{pointer-events:auto}
.places{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.places::-webkit-scrollbar{display:none}
.place{flex:none;display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:8px 11px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);white-space:nowrap}
.place i{width:9px;height:9px;border-radius:50%;flex:none}
.place.here{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.enter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.05rem;text-transform:uppercase;padding:15px 18px;border-radius:14px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.enter small{display:block;font-family:var(--body);font-variation-settings:normal;font-weight:500;font-size:.72rem;text-transform:none;opacity:.7;margin-top:2px}
.enter svg{width:22px;height:22px;flex:none}
.tip{align-self:center;font-size:.74rem;font-weight:600;color:var(--ink);background:var(--surface);padding:7px 12px;border-radius:99px;box-shadow:var(--shadow)}
.phonebtn{position:fixed;right:16px;z-index:11;bottom:calc(132px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.phonebtn svg{width:24px;height:24px}
/* Rooms */
.room{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:roomin .25s ease-out}
@keyframes roomin{from{opacity:0;transform:scale(.98)}}
.room-in{width:100%;max-width:480px;height:100%;padding-inline:16px;padding-block:12px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.room-in.scroll{overflow-y:auto}
.room-in.scroll>*{flex-shrink:0}
.roomhead{display:flex;align-items:center;gap:10px;flex:none}
.leave{display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.leave svg{width:16px;height:16px;transform:rotate(180deg)}
.roomhead h2{margin:0;flex:1;min-width:0;font-family:var(--display);font-variation-settings:"wdth" 120;font-weight:900;font-size:1.35rem;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.mini b{font-family:var(--mono);font-size:1rem}
.mini .bar{width:84px;height:5px}
.art{border-radius:16px;overflow:hidden;box-shadow:var(--shadow);flex:none}
.art svg{display:block;width:100%;height:auto}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;padding:22px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:1.8rem;text-transform:uppercase;letter-spacing:-.02em;transition:transform .06s}
.bigbtn small{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:0;text-transform:none;opacity:.8}
.bigbtn:active{transform:scale(.96)}
.bigbtn[disabled]{background:var(--sunk);color:var(--muted)}
.wsel{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.wbtn{height:52px;display:grid;place-items:center;text-align:center;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--mono);font-size:1.6rem;font-weight:700}
.wbtn:active{transform:scale(.95)}
.wval{display:flex;flex-direction:column;align-items:center;gap:2px}
.wval b{font-family:var(--mono);font-size:1.5rem}
.wval span{font-size:.72rem;color:var(--muted);font-weight:600}
.wval span.pr{color:var(--gold)}
.meter{position:relative;height:30px;border-radius:10px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--up);opacity:.85;border-radius:6px}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;left:0}
.art.fail{animation:nope .35s}
.lift-bar{transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.lift-bar.up{transform:translateY(-40px)}
.sleepfx{position:fixed;inset:0;z-index:60;background:#05070d;display:grid;place-items:center;color:#cfd6ff;font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:3rem;animation:sleep 2.6s ease-in-out forwards}
@keyframes sleep{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
.note{font-size:.86rem;line-height:1.4;padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.note b{color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px}
.kv b{display:block;font-family:var(--mono);font-size:1.05rem;font-weight:700;margin-top:3px}
.reqbar{height:10px;border-radius:10px;background:var(--sunk);overflow:hidden}
.reqbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:10px}
/* premium pass */
.banner{width:max-content;max-width:92vw;white-space:normal;text-align:center;line-height:.95;font-size:clamp(1.5rem,8vw,2.2rem)}
.chip,.place,.hud .iconbtn,.tip{background:color-mix(in oklab,var(--surface) 74%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid color-mix(in oklab,var(--surface) 55%,transparent)}
.place .dot{font-family:var(--mono);font-size:.6rem;font-weight:700;background:var(--down);color:#fff;border-radius:99px;padding:1px 6px;margin-left:2px}
.enter{box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.room{background:radial-gradient(130% 42% at 50% -8%,color-mix(in oklab,var(--pc,var(--accent)) 26%,var(--bg)) 0%,var(--bg) 70%) var(--bg)}
.pdot{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--pc,var(--accent));margin-right:9px;vertical-align:.08em;box-shadow:0 0 0 3px color-mix(in oklab,var(--pc,var(--accent)) 25%,transparent)}
.room .bigbtn{background:var(--pc,var(--accent));color:#fff;box-shadow:0 10px 26px -12px var(--pc,var(--accent))}
.room .bigbtn.alt{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.room .bigbtn.alt2{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.room .bigbtn[disabled]{background:var(--sunk);color:var(--muted);box-shadow:none}
.lst .kg{font-family:var(--mono);font-size:.58rem;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--sunk);color:var(--ink)}
.lst .kg.no{background:var(--down);color:#fff}
.sperks{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sperks div{display:flex;flex-direction:column;gap:2px;padding:10px 14px;opacity:.5}
.sperks div+div{border-top:1px solid var(--line)}
.sperks div.on{opacity:1}
.sperks b{font-size:.86rem;display:flex;justify-content:space-between;gap:8px}
.sperks b em{font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.sperks div.on b em{color:var(--up)}
.sperks span{font-size:.76rem;color:var(--muted)}
.perk.opp{grid-template-columns:auto 1fr auto}
.oav{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden}
.oav i{width:20px;height:20px;border-radius:50%;margin-top:-6px}
.perk.opp .t{grid-column:2}.perk.opp .d{grid-column:2}.perk.opp .c{grid-column:3;background:var(--pc,var(--accent));color:#fff}
.beat{font-style:normal;font-family:var(--mono);font-size:.58rem;font-weight:700;color:var(--up);letter-spacing:.06em}
.perk.ach.done{opacity:.6}
.tug{position:relative;height:34px;border-radius:12px;background:color-mix(in oklab,var(--down) 30%,var(--sunk));overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.tug i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .05s linear}
.tug::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bg);opacity:.7}
.tug span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-weight:700;font-size:.8rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tapbtn{padding:34px 22px;font-size:2.4rem;touch-action:manipulation}
.bankbtns{display:flex;flex-direction:column;gap:8px}
.bankbtns .bigbtn{font-size:1.3rem;padding:16px}
.hudpills{display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none!important}
.hudpills .pill{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;max-width:100%;padding:7px 11px;border-radius:12px;font-size:.74rem;text-align:left}
.pill .pk{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);flex:none}
.pill .pt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .pr{font-family:var(--mono);font-weight:700;color:var(--up);flex:none}
.pill.ev .pk{color:var(--ec,var(--accent))}
.pill.ev{box-shadow:inset 0 0 0 2px var(--ec,var(--accent)),var(--shadow);animation:evp 1s infinite alternate}
@keyframes evp{to{transform:translateY(-1px)}}
.raytoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:45;width:min(92vw,440px);display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in oklab,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 34px -14px rgba(0,0,0,.45);font-size:.86rem;line-height:1.35;animation:rtin .35s cubic-bezier(.2,.8,.2,1)}
.raytoast b{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.rayav{flex:none;width:34px;height:34px;border-radius:50%;background:#4b5563;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900}
.raytoast.low{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@keyframes rtin{from{opacity:0;transform:translate(-50%,8px)}}
.pill.tr .pk{color:var(--gold)}
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ttabs::-webkit-scrollbar{display:none}
.ttab{flex:none;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);min-width:84px;text-align:left;position:relative}
.ttab b{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:.8rem}
.ttab span{font-family:var(--mono);font-size:.7rem;font-weight:600}
.ttab em{font-style:normal;font-family:var(--mono);font-size:.62rem;font-weight:700}
.ttab.on{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.ttab.has::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.u{color:var(--up)} .d{color:var(--down)}
.tcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.thead>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tprice{font-family:var(--mono);font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.thead span:not(.eyebrow){font-family:var(--mono);font-size:.76rem;font-weight:700}
.srcb{flex:none;font-family:var(--mono)!important;font-size:.6rem!important;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.srcb.live{background:color-mix(in oklab,var(--up) 18%,transparent);color:var(--up)}

.srcb.sim{background:color-mix(in oklab,var(--gold) 18%,transparent);color:var(--gold)}
.tfs{display:flex;gap:4px}

.tfs button.on,.chips button.on{background:var(--ink);color:var(--bg)}
.tchart{width:100%;height:230px;display:block}
.tpanel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.tinfo{margin:0;font-size:.74rem;color:var(--muted);line-height:1.45}
.tinfo b{color:var(--ink);font-family:var(--mono)}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtns button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px;border-radius:14px;color:#fff;font-family:var(--display);font-variation-settings:"wdth" 120;font-weight:900;font-size:1.3rem;text-transform:uppercase}
.tbtns small{font-family:var(--body);font-variation-settings:normal;font-size:.68rem;font-weight:600;text-transform:none;opacity:.85}
.tlong{background:var(--up)} .tshort{background:var(--down)}
.tbtns button:active{transform:scale(.97)}
.tpos{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.tpos.long{box-shadow:inset 0 0 0 2px var(--up),var(--shadow)} .tpos.short{box-shadow:inset 0 0 0 2px var(--down),var(--shadow)}
.tph{display:flex;align-items:center;gap:8px}
.tph b{margin-left:auto;font-family:var(--mono);font-size:1.15rem}

.tkv div{box-shadow:none;background:var(--sunk)}
.tpos .bigbtn{font-size:1.2rem;padding:14px;background:var(--ink);color:var(--bg)}
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}

.gcar b{font-size:.84rem}.gcar span{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.gcar.on{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.paints{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.big{width:40px;height:40px;font-family:var(--mono);font-size:.7rem;font-weight:700;color:#fff}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sw.locked{opacity:.35}
.dcard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}
.dcard b{font-size:1rem}.dcard .dsub{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.dcard.done{box-shadow:inset 0 0 0 2px var(--up),var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.cal span{font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal b{font-family:var(--mono);font-size:.64rem}
.cal .past{opacity:.45}.cal .today{background:var(--gold);color:#1b1200}.cal .today span{color:#1b1200}
.lifttabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.lifttabs b{font-size:.84rem}.lifttabs span{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.lifttabs button.on{box-shadow:inset 0 0 0 2px var(--pc,var(--ink)),var(--shadow)}
.dcard.meet{box-shadow:inset 0 0 0 2px var(--pc,var(--accent)),var(--shadow)}
.trow.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow.two>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.pill.q .pk{color:var(--gold)}
.lights{display:flex;justify-content:center;gap:16px;padding:26px;border-radius:16px;background:#141824}
.lights i{width:54px;height:54px;border-radius:50%;background:#2a2f3a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.lights i.r{background:#e2364a;box-shadow:0 0 20px #e2364a}.lights i.g{background:#2fd28a;box-shadow:0 0 24px #2fd28a}
.gymroom{position:relative}

  for(const[v,u]of SUF)if(a>=v){const x=a/v;return s+"$"+(x>=100?Math.round(x):x>=10?x.toFixed(1):x.toFixed(2))+u}
  if(a>=1e5)return s+"$"+Math.round(a/1e3)+"K";if(a>=1e4)return s+"$"+(a/1e3).toFixed(1)+"K";return s+"$"+Math.round(a).toLocaleString("en-US")};

}

    <label class="accf"><span>PIN (optional, 4 digits)</span><input id="aPin" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="Leave empty for no PIN"></label>
    <p class="accmsg" id="aErr"></p>
    <button class="cta" id="aGo"><span>Create and play</span>${ARROW}</button><button class="cta ghost2" id="aBack">Back</button></div>`;
  $("aName").focus();$("aBack").onclick=()=>accScreen();
  $("aGo").onclick=()=>{const name=$("aName").value.trim(),pin=$("aPin").value.trim(),err=t=>{$("aErr").textContent=t;SFX.nope()};
    if(!name)return err("Type a name first.");if(accList().some(a=>a.name.toLowerCase()===name.toLowerCase()))return err("That name is taken on this device.");if(pin&&!/^\d{4}$/.test(pin))return err("PIN must be 4 digits.");
    const a={id:newAccId(),name,created:Date.now(),last:Date.now()};if(pin)a.pin=pinHash(pin);const l=accList();l.push(a);accPut(l);accUse(a);newGame();save();SFX.level();start(true)};
}
function accPin(a){
  const o=$("overlay");o.innerHTML=`<div class="sheet"><h2 class="h2"><small>${esc(a.name).toUpperCase()}</small>Enter your PIN.</h2>
    <label class="accf"><span>PIN</span><input id="aPin" maxlength="4" inputmode="numeric" pattern="[0-9]*" type="password"></label><p class="accmsg" id="aErr"></p>
    <button class="cta" id="aGo"><span>Unlock</span>${ARROW}</button><button class="cta ghost2" id="aBack">Back</button></div>`;
  $("aPin").focus();$("aBack").onclick=()=>accScreen();
  const go=()=>{if(pinHash($("aPin").value.trim())===a.pin){accUse(a);title()}else{$("aErr").textContent="Wrong PIN.";SFX.nope();buzz(40);$("aPin").value=""}};
  $("aGo").onclick=go;$("aPin").onkeydown=e=>{if(e.key==="Enter")go()};
}
function accImport(){
  const o=$("overlay");o.innerHTML=`<div class="sheet"><h2 class="h2"><small>TRANSFER CODE</small>Bring your account here.</h2>
    <p class="lede" style="font-size:.9rem">On your other device, open Home and tap <b>Copy transfer code</b>. Paste it below.</p>
    <label class="accf"><span>Transfer code</span><textarea id="aCode" rows="4" placeholder="FR1.…"></textarea></label><p class="accmsg" id="aErr"></p>
    <button class="cta" id="aGo"><span>Import account</span>${ARROW}</button><button class="cta ghost2" id="aBack">Back</button></div>`;
  $("aBack").onclick=()=>accScreen();
  $("aGo").onclick=()=>{const r=decodeSave($("aCode").value);if(!r){$("aErr").textContent="That code doesn't look right. Copy the whole thing.";SFX.nope();return}
    const l=accList();let name=r.name,n=2;while(l.some(a=>a.name.toLowerCase()===name.toLowerCase()))name=r.name+" "+n++;
    const a={id:newAccId(),name,created:Date.now(),last:Date.now()};l.push(a);accPut(l);store.set(accKey(a.id),r.json);accUse(a);SFX.rebirth();title()};
}
function copyTransfer(btn){save();const a=accCur(),code=encodeSave(a?a.name:"Player",store.get(SAVE));
  const done=()=>{floatAt(btn,"Copied","var(--up)");banner("Transfer code copied","u")};
  const fallback=()=>{const o=$("overlay");o.hidden=false;o.innerHTML=`<div class="sheet"><h2 class="h2"><small>TRANSFER CODE</small>Copy this code.</h2><textarea class="acccode" id="aCode" rows="8" readonly>${code}</textarea><button class="cta" id="aBack"><span>Done</span>${ARROW}</button></div>`;const t=$("aCode");t.focus();t.select();$("aBack").onclick=()=>{o.hidden=true}};
  try{navigator.clipboard.writeText(code).then(done,fallback)}catch(e){fallback()}}
function accountCard(){const a=accCur();return `<div class="sechead"><h3>Account</h3><span class="eyebrow">${a?esc(a.name):""}</span></div>
  <div class="accrow"><button class="perk nopic" id="accCopy"><span class="t">Copy transfer code</span><span class="d">Paste it on another phone or PC to play this account there</span></button>
  <button class="perk nopic" id="accSwitch"><span class="t">Switch account</span><span class="d">Your progress is saved first</span></button></div>`}
function bindAccount(){const c=$("accCopy");if(c)c.onclick=()=>copyTransfer(c);const s=$("accSwitch");if(s)s.onclick=()=>{save();store.set(CUR_KEY,"");location.reload()}}

/* ================= title ================= */
function title(){
  accMigrate();const acc=accCur();if(!acc){accScreen();return}accUse(acc);newGame();
  const o=$("overlay"),has=load();o.hidden=false;let confirmNew=false;
  const draw=()=>{
    o.innerHTML=`<div class="sheet">
      <h1 class="wordmark">Flip<span>Rush</span></h1>
      <div class="accbar"><span class="accav">${esc(acc.name[0]||"?").toUpperCase()}</span><span>Playing as <b>${esc(acc.name)}</b></span><button id="accSw">Switch</button></div>
      <p class="lede">Walk the town, flip everything at the market, hit the gym, trade live charts, and level up forever. Every level lets you pick a new perk.</p>
      <div class="how">
        <div><kbd>WALK</kbd><span>Tap the map to walk. Buttons at the bottom take you straight to a place.</span></div>
        <div><kbd>FLIP</kbd><span>At the Market, tap to buy, hold to lowball, and tap your stash to sell.</span></div>
        <div><kbd>ENERGY</kbd><span>Trading and lifting use energy. Sleep at Home or grab a drink at the Café.</span></div>
        <div><kbd>STRONG</kbd><span>Walk around the Gym to lift, then flex to draw a crowd, gain fans, land sponsors and compete in bodybuilding shows.</span></div>
        <div><kbd>EXPLORE</kbd><span>Finish Uncle Ray's goals to unlock the Beach and Downtown, and buy a bike, scooter and sports car. Watch for random town events.</span></div>
        <div><kbd>HUNT</kbd><span>Bid blind on storage units, race courier deliveries, grab shiny finds around town, and beat your rival Vince.</span></div>
        <div><kbd>EMPIRE</kbd><span>Rich already? Build Flip Tower floor by floor, buy a yacht, jet and island, and climb the rich list to #1.</span></div>
        <div><kbd>LEVEL</kbd><span>Everything you earn levels you up. Each level, pick 1 of 3 perk cards to shape your own build.</span></div>
      </div>
      ${has?`<button class="cta" id="bCont"><span>Continue<small style="display:block;font-family:var(--mono);font-size:.7rem;font-weight:600;text-transform:none;opacity:.7">${fmt(S.cash)} · Level ${repLevel()} · Day ${S.day}</small></span>${ARROW}</button>
        <button class="cta" id="bNew" style="background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-size:.95rem">${confirmNew?"Tap again to erase your save":"New game"}</button>`
       :`<button class="cta" id="bNew"><span>Start playing</span>${ARROW}</button>`}
      <p class="fine">Progress saves automatically.</p></div>`;
    $("accSw").onclick=()=>{store.set(CUR_KEY,"");accScreen()};
    if(has)$("bCont").onclick=()=>start();
    $("bNew").onclick=()=>{if(has&&!confirmNew){confirmNew=true;draw();return}store.del(SAVE);newGame();save();start(true)};
  };draw();
}
function start(isNew){shownCash=null;if(!S.lifts){const r=x=>Math.max(20,Math.round(x/2.5)*2.5);S.lifts={bench:r(S.pr*.7),squat:r(S.pr*.9),dead:S.pr}}syncHome();ensureDaily();if(!isNew&&S.login.d!==dayKey())return loginReward(()=>start(isNew));if(isNew)S.login={d:dayKey(),streak:1};if(Object.keys(S.pos||{}).length)feedInit();audioOn();$("overlay").hidden=true;playing=true;bKey="";renderHud();renderBottom();renderGoalChip();if(isNew){banner("Welcome to town","a")}const g=GOALS[S.goal];rayText(g?g.d:"Every goal done. Keep flipping, legend.")}

/* ================= fit phones showing the desktop layout ================= */
function fitScreen(){
  root.style.zoom="";root.style.height="";
  const sw=Math.min(screen.width,screen.height)>0&&innerWidth<innerHeight?Math.min(screen.width,screen.height):screen.width;
  if(!matchMedia("(pointer:coarse)").matches||!sw||innerWidth<=sw*1.15)return;
  const z=innerWidth/sw;root.style.zoom=z;root.style.height=(innerHeight/z)+"px";
}
fitScreen();resize();
newGame();
title();
requestAnimationFrame(loop);
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>

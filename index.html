<title>Flip Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400..700&display=swap">
<style>
/* Layout: one-screen resale exchange — account header, live news line, listings feed (hold to lowball), collector strip, stash grid with sparklines. */
:root{
  --bg:#eceef2; --surface:#ffffff; --sunk:#e2e5ea; --ink:#0d1015; --muted:#677080; --line:#d8dce3;
  --accent:#2a3cff; --accent-ink:#ffffff; --up:#08965a; --down:#df2f45; --gold:#b97c00;
  --tl:.93; --tc:.05; --tt:.38; --shadow:0 1px 0 rgba(13,16,21,.04),0 8px 24px -12px rgba(13,16,21,.18);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d11; --surface:#14171d; --sunk:#1b1f27; --ink:#eff2f6; --muted:#8a93a4; --line:#242a34;
  --accent:#6d7bff; --accent-ink:#0b0d11; --up:#2fd28a; --down:#ff5b6e; --gold:#ffc24a;
  --tl:.31; --tc:.06; --tt:.86; --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d11; --surface:#14171d; --sunk:#1b1f27; --ink:#eff2f6; --muted:#8a93a4; --line:#242a34;
  --accent:#6d7bff; --accent-ink:#0b0d11; --up:#2fd28a; --down:#ff5b6e; --gold:#ffc24a;
  --tl:.31; --tc:.06; --tt:.86; --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,.lst:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Header */
.top{display:flex;flex-direction:column;gap:8px}
.row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cash{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:800;font-size:2.5rem;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .25s}
.cash.gain{color:var(--up)} .cash.spend{color:var(--ink)}
.right{display:flex;align-items:center;gap:8px}
.daypill{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.daypill .clk{color:var(--muted)} .daypill.low .clk{color:var(--down)}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.iconbtn svg{width:16px;height:16px}
.clock{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.clock i{display:block;height:100%;background:var(--ink);transform-origin:left;width:100%}
.clock.low i{background:var(--down)}
.rentline{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
.rentline b{color:var(--ink);font-family:var(--mono);font-weight:600}
.rentbar{flex:1;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.rentbar i{display:block;height:100%;width:0;background:var(--down);border-radius:6px;transition:width .3s,background .3s}
.rentbar.ok i{background:var(--up)}
#rentState{font-family:var(--mono);font-weight:600;min-width:9ch;text-align:right}

/* News */
.news{display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;font-size:.8rem}
.live{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.1em;color:var(--down);display:flex;align-items:center;gap:5px;flex:none}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#news{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#news.in{animation:slidein .35s ease-out}
#news b.u{color:var(--up)} #news b.d{color:var(--down)}
@keyframes slidein{from{transform:translateY(100%);opacity:0}}

.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sechead h3{margin:0;font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:.95rem;letter-spacing:-.01em;text-transform:uppercase}
.sechead .eyebrow{margin-left:auto;letter-spacing:.06em;text-transform:none;font-size:.72rem}

/* Tiles */
.tile{--h:250;flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:oklch(var(--tl) var(--tc) var(--h));color:oklch(var(--tt) .13 var(--h));font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:.95rem;letter-spacing:-.02em}
.tile.sm{width:34px;height:34px;border-radius:8px;font-size:.78rem}

/* Listings */
.market{display:flex;flex-direction:column;gap:6px}
.lst{position:relative;height:62px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px 0 9px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;touch-action:none}
.lst .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lst .nm{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .sub{display:flex;gap:7px;align-items:center;font-size:.72rem;color:var(--muted);white-space:nowrap}
.cond{font-family:var(--mono);font-size:.62rem;font-weight:600;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.disc{font-family:var(--mono);font-weight:600;color:var(--up)}
.disc.neg{color:var(--down)}
.ask{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:72px}
.pr{font-family:var(--mono);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.act{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--ink);color:var(--bg)}
.lst .life{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.lst .life i{display:block;height:100%;background:var(--muted);opacity:.5;transform-origin:left}
.lst.steal .act{background:var(--gold);color:#1b1200}
.lst.steal .life i{background:var(--gold);opacity:1}
.lst .tag{display:none;font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.08em;color:var(--gold)}
.lst.steal .tag{display:inline}
.lst.broke .pr{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.lst.broke .act{background:var(--sunk);color:var(--muted)}
.lst.hag{--risk:0;animation:jit .09s infinite alternate}
.lst.hag .act{background:var(--accent);color:var(--accent-ink)}
.lst.hag .pr{color:var(--accent)}
.lst.hag::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 2px var(--accent);opacity:calc(.4 + var(--risk))}
@keyframes jit{from{transform:translateX(calc(var(--risk) * -3px))}to{transform:translateX(calc(var(--risk) * 3px))}}
.lst.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lst.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line);justify-content:center;color:var(--muted);font-size:.78rem;cursor:default}
.lst.empty .shim{width:40%;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:shim 1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.lst.walked{background:transparent;box-shadow:inset 0 0 0 1px var(--down);justify-content:center;color:var(--down);font-size:.8rem;font-weight:600;cursor:default}
.lst.fresh{animation:drop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-8px) scale(.98);opacity:0}}

/* Collector */
.collector{height:52px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px 0 9px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:.8rem}
.collector.on{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow);background:var(--surface);color:var(--ink);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 4px color-mix(in oklab,var(--gold) 22%,transparent)}}
.collector .ct{flex:1;min-width:0;line-height:1.3}
.collector .ct b{font-weight:700}
.collector .mult{font-family:var(--mono);font-weight:700;color:var(--gold)}
.ring{--p:1;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*360deg),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring span{width:22px;height:22px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;font-weight:700}

/* Stash */
.stashsec{flex:1;min-height:0;display:flex;flex-direction:column}
.streak{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.streak i{display:block;width:34px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.streak i::after{content:"";display:block;height:100%;width:calc(var(--s,0)*100%);background:var(--accent)}
.stash{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;padding-bottom:6px;scrollbar-width:none}
.stash::-webkit-scrollbar{display:none}
.itm{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:6px 10px;padding:10px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);min-width:0;transition:transform .08s}
.itm:active{transform:scale(.97)}
.itm .iv{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.bid{font-family:var(--mono);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.pl{font-family:var(--mono);font-size:.7rem;font-weight:600}
.itm.up .pl{color:var(--up)} .itm.down .pl{color:var(--down)}
.inm{grid-column:1/-1;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{grid-column:1/-1;width:100%;height:22px;display:block}
.spark path.l{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.itm.up .spark{color:var(--up)} .itm.down .spark{color:var(--down)}
.spark path.l{stroke:currentColor} .spark path.a{fill:currentColor;opacity:.12}
.itm .hc{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#1b1200;background:var(--gold);padding:2px 6px;border-radius:99px;display:none}
.itm.hot{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}
.itm.hot .hc{display:block}
.itm.new{animation:drop .3s cubic-bezier(.2,.9,.3,1.2)}
.slot0{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--muted);font-size:.72rem;min-height:104px}

/* FX */
.float{position:fixed;pointer-events:none;z-index:40;font-family:var(--mono);font-weight:700;font-size:1.15rem;animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.float small{display:block;font-size:.62rem;letter-spacing:.08em;text-align:center}
@keyframes rise{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{transform:translate(-50%,-8px) scale(1.1);opacity:1}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.banner{position:fixed;left:50%;top:38%;z-index:41;pointer-events:none;font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:2.4rem;letter-spacing:-.03em;text-transform:uppercase;color:var(--ink);white-space:nowrap;animation:ban 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.banner.g{color:var(--gold)} .banner.a{color:var(--accent)}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(1.6);opacity:0;filter:blur(6px)}18%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:none}75%{opacity:1}100%{transform:translate(-50%,-60%);opacity:0}}

/* Overlay screens */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;overflow-y:auto;padding-inline:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.sheet{width:100%;max-width:420px;margin:auto 0;display:flex;flex-direction:column;gap:18px;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.wordmark{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:clamp(4rem,22vw,6.2rem);line-height:.82;letter-spacing:-.055em;margin:0}
.wordmark span{display:block;color:var(--accent)}
.lede{font-size:1.05rem;line-height:1.45;color:var(--muted);margin:0;max-width:30ch}
.how{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.how div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;font-size:.86rem;line-height:1.35}
.how div+div{border-top:1px solid var(--line)}
.how kbd{font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.06em;padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);min-width:44px;text-align:center}
.cta{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.15rem;text-transform:uppercase;letter-spacing:-.01em;padding:18px 20px;border-radius:14px;transition:transform .1s}
.cta:active{transform:scale(.98)}
.cta svg{width:22px;height:22px}
.fine{font-size:.76rem;color:var(--muted);text-align:center;margin:0}
.h2{font-family:var(--display);font-variation-settings:"wdth" 120;font-weight:900;font-size:2.4rem;line-height:.9;letter-spacing:-.04em;margin:0;text-transform:uppercase}
.h2 small{display:block;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.stmt{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 16px;font-size:.88rem}
.stmt div{display:flex;justify-content:space-between;padding:9px 0}
.stmt div+div{border-top:1px dashed var(--line)}
.stmt span:last-child{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.stmt .tot{font-weight:700;font-size:1rem}
.stmt .pos{color:var(--up)} .stmt .neg{color:var(--down)}
.perks{display:flex;flex-direction:column;gap:6px}
.perk{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.perk .t{font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.pips{display:flex;gap:3px}.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--accent)}
.perk .d{font-size:.76rem;color:var(--muted)}
.perk .c{grid-row:1/3;grid-column:2;font-family:var(--mono);font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.perk[disabled]{box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.perk[disabled] .c{background:var(--sunk);color:var(--muted)}
.perk.bought{animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.02)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 div{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.grid2 b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:700;margin-top:4px}
.rank{font-family:var(--display);font-variation-settings:"wdth" 110;font-weight:800;font-size:1.1rem;color:var(--accent)}
/* Goals, events, special listings */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.goal{display:flex;align-items:center;justify-content:space-between;gap:6px;height:28px;padding:0 9px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);font-size:.68rem;font-weight:600;color:var(--muted);min-width:0}
.goal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.goal b{font-family:var(--mono);color:var(--ink);flex:none;font-size:.66rem}
.goal.done{background:color-mix(in oklab,var(--up) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--up);color:var(--up)}
.goal.done b{color:var(--up)}
.goal.pop{animation:pulse .45s}
.lst .nm{display:flex;gap:8px;align-items:baseline}
.lst .nt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sel{flex:none;font-family:var(--mono);font-size:.62rem;font-weight:600;color:var(--muted)}
.sel.bad{color:var(--down)}
.fk{font-family:var(--mono);font-size:.58rem;font-weight:700;color:#fff;background:var(--down);padding:1px 5px;border-radius:4px}
.tile.mys{background:linear-gradient(135deg,var(--gold),color-mix(in oklab,var(--gold) 45%,var(--accent)));color:#1b1200;font-size:1.35rem}
.lst.grail{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 4px color-mix(in oklab,var(--gold) 25%,transparent),var(--shadow)}
.lst.grail .tag{display:inline}
.lst.grail .act,.lst.mys .act{background:var(--gold);color:#1b1200}
.collector{position:relative;overflow:hidden;height:auto;min-height:56px}
.collector.offer,.collector.auction{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.collector.auction{animation:glowA 1s infinite alternate}
@keyframes glowA{to{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent)}}
.evbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left}
.ebtn{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-radius:10px;flex:none;white-space:nowrap}
.ebtn.go{background:var(--accent);color:var(--accent-ink)}
.ebtn.ghost{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.ebtn[disabled]{opacity:.4}
.btns{display:flex;gap:6px}
.collector .ct .l1,.collector .ct .l2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{color:var(--muted)} .who.bad{color:var(--down);font-weight:700}
.lead-you{color:var(--up);font-weight:700} .lead-rival{color:var(--down);font-weight:700}
.itm .fc{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.62rem;font-weight:700;color:#fff;background:var(--down);padding:2px 6px;border-radius:99px}
.banner.r{color:var(--down)}
.modchip{font-family:var(--mono);font-size:.64rem;font-weight:700;color:var(--accent);padding:3px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--accent);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.mods{display:grid;gap:8px}
.modcard{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);transition:transform .1s}
.modcard:active{transform:scale(.98)}
.modcard .mt{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:-.01em}
.modcard .md{font-size:.84rem;color:var(--muted);line-height:1.4}
.modcard .mg{margin-top:6px;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.modcard .mg svg{width:14px;height:14px}
.note{font-size:.86rem;line-height:1.4;padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.note b{color:var(--accent)}
.rep{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rep .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.78rem;color:var(--muted)}
.rep .lv{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1rem;color:var(--ink);text-transform:uppercase}
.repbar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.repbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.stmt .ok{color:var(--up)} .stmt .miss{color:var(--muted)}
@media (max-height:700px){#app{gap:8px}.goal{height:24px}.lst{height:54px}.tile{width:38px;height:38px}.cash{font-size:2.1rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-height:640px){.lst{height:54px}.tile{width:38px;height:38px}.collector{height:44px}.cash{font-size:2.1rem}}
</style>

<div id="app">
  <header class="top">
    <div class="row1">
      <div>
        <div class="eyebrow">Cash balance</div>
        <div id="cash" class="cash">$100</div>
      </div>
      <div class="right">
        <div class="daypill" id="daypill"><span>DAY <b id="day">1</b></span><span class="clk" id="clk">0:45</span></div>
        <button class="iconbtn" id="mute" aria-label="Toggle sound"></button>
      </div>
    </div>
    <div class="clock" id="clock"><i id="clockBar"></i></div>
    <div class="rentline"><span>Rent</span><b id="rent">$60</b><div class="rentbar" id="rentbar"><i id="rentFill"></i></div><span id="rentState"></span></div>

  <div class="news"><span class="live">LIVE</span><span id="news">Market opens at the bell</span></div>
  <div id="goals" class="goals"></div>

  <section>
    <div class="sechead"><h3>Listings</h3><span class="eyebrow" id="hint">Tap to buy · hold to lowball</span></div>
    <div id="market" class="market"></div>
  </section>

  <div id="event" class="collector"></div>

  <section class="stashsec">
    <div class="sechead"><h3>Stash</h3><span class="mono eyebrow" style="margin-left:0" id="slots">0/4</span><span id="streak" class="streak" style="margin-left:auto"></span></div>
    <div id="stash" class="stash"></div>
  </section>
</div>
<div id="overlay" class="overlay"></div>

<script>
(()=>{
/* ---------- data ---------- */
const CATS=[
 {k:"kicks",n:"Kicks",h:28,conds:[["DS",1],["VNDS",.82],["Used",.6]],items:[["HT","Hi-Top '85 'Varsity'",320],["ZB","Boost Runner 'Zebra'",260],["PL","Court Low 'Panda'",130],["DR","Dad Runner 'Grey'",190]]},
 {k:"tech",n:"Tech",h:262,conds:[["Sealed",1.1],["Open box",.88],["Used",.7]],items:[["BP","Buds Pro 2",160],["PC","Pocket Console OLED",260],["FP","Flagship Phone 14",620],["RC","Retro Compact Cam",1400]]},
 {k:"vint",n:"Vintage",h:78,conds:[["Mint",1.1],["Good",.85],["Worn",.6]],items:[["WJ","Workwear Detroit Jacket",180],["GT","'93 Grunge Band Tee",240],["SD","'80s Selvedge Denim",110],["TK","Teddy Knit Sweater",340]]},
 {k:"cards",n:"Cards",h:325,conds:[["PSA 10",1.4],["PSA 8",.8],["Raw",.5]],items:[["EM","Electric Mouse Promo",90],["RK","'03 Rookie Card",450],["FD","Fire Dragon Holo",900],["HL","'86 Hoops Legend",3800]]},
 {k:"watch",n:"Watches",h:165,conds:[["Full set",1.1],["Watch only",.85]],items:[["SQ","Square Digital",110],["AD","Auto Diver",220],["HD","Heritage Diver",3200],["MC","Moon Chrono",5600]]},
 {k:"toys",n:"Toys",h:210,conds:[["Sealed",1.1],["Loose",.7]],items:[["MB","Monster Blind Box",70],["BF","Bear Figure 400%",260],["AT","Art Toy Companion",480]]}
];
const CAT={};CATS.forEach(c=>CAT[c.k]=c);
const POOL=CATS.flatMap(c=>c.items.map(i=>({cat:c.k,code:i[0],name:i[1],base:i[2]})));
const ORDER=["kicks","vint","toys","tech","cards","watch"];
const NEWS={
 kicks:[["A rapper wore them courtside","Surprise collab sold out in 3 minutes"],["The brand restocked everything","Fakes are flooding the market"]],
 tech:[["Stores are sold out nationwide","An unboxing went viral overnight"],["A new model was just announced","A retailer is dumping inventory"]],
 vint:[["'90s revival on every runway","A celebrity thrift haul went viral"],["Fast fashion copied the look","Thrift TikTok moved on"]],
 cards:[["A graded card just sold for a record","A streamer's box break went viral"],["A reprint was announced","The grading backlog cleared"]],
 watch:[["Dealer waitlists hit two years","The brand raised retail prices"],["The grey market is cooling off","Dealers are dumping stock"]],
 toys:[["A pop star posted her collection","Blind boxes sold out in minutes"],["The factory overproduced","The hype moved on"]]
};
const PERKS=[
 {k:"slots",t:"Storage unit",d:"+2 stash slots",cost:l=>150+l*220,max:4},
 {k:"legit",t:"Legit check",d:"Fakes are flagged before you buy",cost:()=>220,max:1},
 {k:"tongue",t:"Silver tongue",d:"Lowballing is 35% less likely to scare sellers",cost:l=>180+l*240,max:2},
 {k:"feed",t:"Extra seller",d:"4 listings at once",cost:()=>320,max:1},
 {k:"clout",t:"Clout",d:"Collectors pay +0.3×",cost:l=>240+l*300,max:3},
 {k:"alerts",t:"Price alerts",d:"Listings stay up 30% longer",cost:l=>160+l*200,max:2},
 {k:"hours",t:"Long hours",d:"+10 seconds every day",cost:l=>200+l*240,max:3}
];
const MODS=[
 {k:"hype",t:c=>CAT[c].n+" Week",d:c=>`More ${CAT[c].n.toLowerCase()} listings, and ${CAT[c].n.toLowerCase()} prices open 30% higher. Great day to sell what you're holding.`},
 {k:"flea",t:()=>"Flea Market",d:()=>"Everything lists 20% cheaper, but listings vanish 30% faster."},
 {k:"con",t:()=>"Collector Convention",d:()=>"Collectors show up all day and pay an extra +0.4×."},
 {k:"crash",t:()=>"Market Dip",d:()=>"Every price opens 25% lower. Buy cheap now and hold for the recovery."},
 {k:"wild",t:()=>"Wild Day",d:()=>"Prices swing twice as hard and news breaks twice as often."},
 {k:"mys",t:()=>"Mystery Day",d:()=>"Mystery boxes show up all day. Some hold grails."},
 {k:"fakes",t:()=>"Fake Flood",d:()=>"Way more steals, but lots of them are fakes. Watch the seller ratings."},
 {k:"chill",t:()=>"Landlord Discount",d:()=>"Rent is 30% lower tonight, but the day is 10 seconds shorter."}
];
const GOALS={
 flipcat:()=>{const c=pick(S.unlocked);return{cat:c,need:2,label:`2 ${CAT[c].n} flips`}},
 bigflip:()=>{const thr=Math.max(30,Math.round(rentToday()*.35/5)*5);return{thr,need:1,label:`+${fmt(thr)} flip`}},
 lowball:()=>S.day<3?{need:1,label:"Lowball 25%"}:{need:2,label:"2× lowball 25%"},
 collector:()=>S.day<4?{need:1,label:"Collector sale"}:{need:2,label:"2 collectors"},
 streak:()=>({need:1,label:"×1.3 streak"}),
 steal:()=>({need:2,label:"2 steals"}),
 auction:()=>({need:1,label:"Win auction"}),
 mystery:()=>({need:1,label:"Mystery box"})
};
const LEGACY=[[60,"Start every run with $150"],[180,"Tech market open from day 1"],[360,"Start with a Storage unit"],[600,"Start every run with $250"],[900,"Collectors pay +0.2× more"],[1300,"Legit check from the start"]];
const RANKS=[[0,"Window shopper"],[1,"Garage flipper"],[3,"Weekend reseller"],[5,"The plug"],[8,"Store owner"],[11,"Resale mogul"]];

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const fmt=n=>(n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let best=+store.get("fliprush_best")||0;
let rep=+store.get("fliprush_rep")||0;
const repLevel=r=>LEGACY.filter(l=>r>=l[0]).length;

/* ---------- sound ---------- */
let ac=null,muted=store.get("fliprush_muted")==="1";
function audioOn(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){ac=null}}
function tone(f,d,{type="sine",vol=.07,to=0,at=0}={}){
  if(!ac||muted)return;const t=ac.currentTime+at;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.03);
}
const SFX={
  buy(){tone(420,.07,{type:"triangle",vol:.09});tone(630,.09,{type:"triangle",vol:.07,at:.05})},
  sell(st){const b=880*Math.pow(2,Math.min(st,8)/12);tone(b,.12,{vol:.08});tone(b*1.5,.22,{vol:.06,at:.07});tone(b*2,.3,{vol:.03,at:.14})},
  loss(){tone(330,.18,{type:"triangle",vol:.08,to:190})},
  tick(d){tone(900+d*2600,.025,{type:"square",vol:.025})},
  walk(){tone(150,.25,{type:"sawtooth",vol:.05,to:70})},
  nope(){tone(200,.08,{type:"square",vol:.04});tone(160,.1,{type:"square",vol:.04,at:.07})},
  hot(){tone(660,.08,{vol:.06});tone(990,.12,{vol:.06,at:.08})},
  news(){tone(1200,.05,{vol:.03});tone(1500,.05,{vol:.03,at:.06})},
  count(){tone(1400,.04,{type:"square",vol:.025})},
  bid(){tone(520,.05,{type:"triangle",vol:.07});tone(780,.06,{type:"triangle",vol:.05,at:.04})},
  goal(){tone(660,.1,{vol:.06});tone(880,.1,{vol:.06,at:.09});tone(1320,.3,{vol:.05,at:.18})},
  grail(){tone(784,.15,{vol:.07});tone(988,.15,{vol:.07,at:.1});tone(1318,.5,{vol:.06,at:.2});tone(1568,.6,{vol:.04,at:.3})},
  reveal(){[0,.06,.12,.18].forEach((a,i)=>tone(900+i*240,.12,{vol:.05,at:a}))},
  scam(){tone(220,.35,{type:"sawtooth",vol:.06,to:55})},
  bell(){tone(1046,.8,{vol:.07});tone(1318,.9,{vol:.05,at:.12});tone(1568,1,{vol:.04,at:.24})}
};
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function drawMute(){$("mute").innerHTML=muted?ICON_OFF:ICON_ON}
$("mute").onclick=()=>{audioOn();muted=!muted;store.set("fliprush_muted",muted?"1":"0");drawMute()};
drawMute();

/* ---------- state ---------- */
let S;
function fresh(){
  const lv=repLevel(rep);
  S={cash:lv>=4?250:lv>=1?150:100,day:1,t:0,dayLen:45,running:false,nextId:1,
     unlocked:ORDER.slice(0,3).concat(lv>=2?["tech"]:[]),newMarket:null,
     stash:[],market:[],restock:[],trend:{},hist:{},
     perk:{slots:lv>=3?1:0,legit:lv>=6?1:0,tongue:0,feed:0,clout:0,alerts:0,hours:0},
     bonusClout:lv>=5?.2:0,mod:null,goals:[],ev:null,nextEv:5,auctionDone:false,
     streak:0,streakT:-99,dayStats:null,flips:0,totalProfit:0,bestFlip:0,goalsDone:0,grails:0,newsT:0};
  S.shown=S.cash;
  CATS.forEach(c=>{S.trend[c.k]=1;S.hist[c.k]=Array(40).fill(1)});
}
const modIs=k=>!!S.mod&&S.mod.k===k;
const rentFor=d=>Math.round(60*Math.pow(1.45,d-1)/5)*5;
const rentToday=()=>Math.round(rentFor(S.day)*(modIs("chill")?.7:1)/5)*5;
const maxSlots=()=>4+S.perk.slots*2;
const feedSize=()=>3+S.perk.feed;
const mult=()=>1.6+S.perk.clout*.3+S.bonusClout+(modIs("con")?.4:0);
const valueOf=s=>s.base*S.trend[s.cat]*s.noise*(s.fake?.12:1);
const stashVal=()=>S.stash.reduce((a,s)=>a+valueOf(s),0);
const hotFor=s=>!!S.ev&&S.ev.type==="collector"&&S.ev.cat===s.cat&&!s.fake;
function affordable(k=1){const cap=Math.max(260,(S.cash+stashVal())*1.4)*k;return POOL.filter(p=>S.unlocked.includes(p.cat)&&p.base<=cap)}

function newListing(){
  const life=rnd(3.6,6.2)*(1+.3*S.perk.alerts)*(modIs("flea")?.7:1);
  const base0={id:S.nextId++,disc:0,gone:0,fake:false};
  // Grails: rare, short-lived, priced well under market
  if(S.day>=2&&Math.random()<.025){
    const g=pick(POOL.filter(p=>p.base>=900)),c=CAT[g.cat],cond=c.conds[0];
    const base=Math.round(g.base*cond[1]),ask=Math.round(base*S.trend[g.cat]*rnd(.5,.75));
    return {...base0,kind:"grail",cat:g.cat,code:g.code,name:g.name,cond:cond[0],base,ask,price:ask,life:3.4,left:3.4,rating:5,sales:rint(400,2000)};
  }
  const wantBox=S.goals.some(g=>g.k==="mystery"&&!g.done);
  if(Math.random()<(modIs("mys")?.3:wantBox?.13:.06)){
    const pool=affordable(),avg=pool.reduce((a,p)=>a+p.base,0)/pool.length;
    const ask=Math.max(10,Math.round(avg*rnd(.45,.7)/5)*5);
    return {...base0,kind:"mystery",cat:null,code:"?",name:"Mystery Box",cond:"Sealed",base:0,ask,price:ask,life,left:life,rating:rnd(4.4,5),sales:rint(20,900)};
  }
  let pool=affordable(Math.random()<.12?3:1);
  if(modIs("hype")&&Math.random()<.55){const f=pool.filter(p=>p.cat===S.mod.cat);if(f.length)pool=f}
  const it=pick(pool),c=CAT[it.cat],cond=pick(c.conds);
  const base=Math.round(it.base*cond[1]),mv=base*S.trend[it.cat];
  const steal=Math.random()<(modIs("fakes")?.32:.18);
  let r=steal?rnd(.36,.6):rnd(.6,1.12);if(modIs("flea"))r*=.8;
  const fake=steal&&Math.random()<(modIs("fakes")?.55:.28);
  const ask=Math.max(5,Math.round(mv*r));
  // Most fakes come from sketchy sellers, but a few honest sellers look sketchy too
  let rating=rnd(4.5,5),sales=rint(30,3000);
  if(fake&&Math.random()<.8){rating=Math.random()<.4?0:rnd(2.9,4.1);sales=rint(0,12)}
  else if(!fake&&Math.random()<.08){rating=rnd(3.6,4.3);sales=rint(3,40)}
  return {...base0,kind:"item",cat:it.cat,code:it.code,name:it.name,cond:cond[0],base,ask,price:ask,life,left:life,fake,rating,sales};
}
function openBox(price){
  const jackpot=Math.random()<.07;
  let pool=jackpot?POOL.filter(p=>S.unlocked.includes(p.cat)&&p.base>=Math.max(400,price*3)):affordable(1.2);
  if(!pool.length)pool=affordable();
  const it=pick(pool),c=CAT[it.cat],cond=jackpot?c.conds[0]:pick(c.conds);
  return {cat:it.cat,code:it.code,name:it.name,cond:cond[0],base:Math.round(it.base*cond[1]),noise:rnd(.95,1.05),fake:false};
}

/* ---------- rendering ---------- */
function spark(h){
  const w=100,ht=22,mn=Math.min(...h),mx=Math.max(...h),rg=Math.max(.08,mx-mn);
  const pts=h.map((v,i)=>[(i/(h.length-1))*w,ht-2-((v-mn)/rg)*(ht-4)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d}L${w} ${ht}L0 ${ht}Z"/><path class="l" d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}
const tileFor=(cat,code,sm)=>cat?`<div class="tile${sm?" sm":""}" style="--h:${CAT[cat].h}">${code}</div>`:`<div class="tile mys${sm?" sm":""}">?</div>`;

const slotEls=[];let slotKeys=[];
function buildMarket(){
  const m=$("market");m.innerHTML="";slotEls.length=0;slotKeys=[];
  for(let i=0;i<feedSize();i++){const el=document.createElement("div");el.className="lst";el.dataset.i=i;el.tabIndex=0;m.appendChild(el);slotEls.push(el)}
}
function drawSlot(i){
  const el=slotEls[i],l=S.market[i];
  const key=l?(l.id+(l.gone?"g":"")):"e";
  if(slotKeys[i]===key)return;slotKeys[i]=key;
  if(!l){el.className="lst empty";el.innerHTML='<span class="shim"></span>';el.f=null;return}
  if(l.gone){el.className="lst walked";el.innerHTML="Seller walked";el.f=null;return}
  const box=l.kind==="mystery",bad=l.rating===0||l.rating<4.3;
  el.className="lst fresh"+(l.kind==="grail"?" grail":"")+(box?" mys":"");
  el.innerHTML=`${tileFor(l.cat,l.code)}
   <div class="info"><div class="nm"><span class="nt">${l.name}</span><span class="sel${bad?" bad":""}">${l.rating===0?"New seller":"★"+l.rating.toFixed(1)}</span></div>
   <div class="sub"><span class="cond">${l.cond}</span>${box?"<span>Could be anything</span>":'<span>Mkt <span class="mono" data-f="mv"></span></span><span class="disc" data-f="disc"></span>'}<span class="tag">${l.kind==="grail"?"GRAIL":"STEAL"}</span>${S.perk.legit&&l.fake?'<span class="fk">FAKE</span>':""}</div></div>
   <div class="ask"><div class="pr" data-f="pr"></div><div class="act" data-f="act">${box?"Open":"Buy"}</div></div>
   <div class="life"><i data-f="life"></i></div>`;
  el.f={};el.querySelectorAll("[data-f]").forEach(n=>el.f[n.dataset.f]=n);
  el.setAttribute("aria-label",`${l.name}, ${l.cond}`);
  if(l.kind==="grail"){SFX.grail();buzz([20,30,20])}
}
function updateMarket(){
  for(let i=0;i<slotEls.length;i++){
    drawSlot(i);const l=S.market[i],el=slotEls[i];if(!l||l.gone||!el.f)continue;
    const hag=hold&&hold.i===i&&hold.active;
    if(el.f.mv){
      const mv=l.base*S.trend[l.cat],off=1-l.price/mv;
      el.f.mv.textContent=fmt(mv);
      el.f.disc.textContent=(off>=0?"−":"+")+Math.abs(Math.round(off*100))+"%";
      el.f.disc.classList.toggle("neg",off<0);
      el.classList.toggle("steal",off>=.3);
    }
    el.f.pr.textContent=fmt(l.price);
    el.f.act.textContent=hag?"Lowball":l.kind==="mystery"?"Open":"Buy";
    el.f.life.style.transform=`scaleX(${Math.max(0,l.left/l.life)})`;
    el.classList.toggle("broke",l.price>S.cash&&!hag);
    el.classList.toggle("hag",!!hag);
    if(hag)el.style.setProperty("--risk",Math.min(1,l.disc*2.8).toFixed(2));
  }
}
function renderStash(newIdx=-1){
  let h="";
  for(let i=0;i<maxSlots();i++){
    const s=S.stash[i];
    if(!s){h+=`<div class="slot0">Empty slot</div>`;continue}
    const hot=hotFor(s),v=valueOf(s)*(hot?mult():1),pct=(v-s.paid)/Math.max(1,s.paid);
    h+=`<button class="itm ${pct>=0?"up":"down"}${hot?" hot":""}${s.fake?" fake":""}${i===newIdx?" new":""}" data-i="${i}" aria-label="Sell ${s.name} for ${fmt(v)}">
      ${tileFor(s.cat,s.code,true)}
      <div class="iv"><span class="bid">${fmt(v)}</span><span class="pl">${pct>=0?"+":"−"}${Math.abs(Math.round(pct*100))}% · paid ${fmt(s.paid)}</span></div>
      <div class="inm">${s.name} · ${s.cond}</div>${spark(S.hist[s.cat])}${s.fake?'<span class="fc">FAKE</span>':`<span class="hc">×${mult().toFixed(1)}</span>`}</button>`;
  }
  $("stash").innerHTML=h;$("slots").textContent=S.stash.length+"/"+maxSlots();
}
function renderGoals(popIdx=-1){
  $("goals").innerHTML=S.goals.map((g,i)=>`<div class="goal${g.done?" done":""}${i===popIdx?" pop":""}"><span>${g.label}</span><b>${g.done?"✓":g.have+"/"+g.need}</b></div>`).join("");
}
function renderHint(){
  $("hint").outerHTML=S.mod?`<span class="modchip" id="hint">${S.mod.t}</span>`:'<span class="eyebrow" id="hint">Tap to buy · hold to lowball</span>';
}

/* event strip: collectors, offers, auctions */
let evKey=null;
function renderEvent(){
  const el=$("event"),e=S.ev,key=e?e.id:"none";
  if(key!==evKey){
    evKey=key;
    if(!e){el.className="collector";el.innerHTML='<div class="ct">Quiet for now. Collectors, buyer offers and live auctions show up here.</div>'}
    else if(e.type==="collector"){const c=CAT[e.cat];el.className="collector on";

const summary=()=>S.unlocked.map(k=>{const p=Math.round((S.trend[k]-1)*100);return `${CAT[k].n} <b class="${p>=0?"u":"d"}">${p>=0?"▲":"▼"}${Math.abs(p)}%</b>`}).join(" · ");

function floatAt(el,html,color){
  const r=el.getBoundingClientRect(),f=document.createElement("div"),k=cssScale();
  f.className="float";f.innerHTML=html;f.style.color=color;f.style.left=(r.left+r.width/2)/k+"px";f.style.top=(r.top+r.height*.25)/k+"px";

// Banners queue up so two big moments never land on top of each other
const bq=[];let bBusy=false;
function banner(t,cls=""){bq.push([t,cls]);if(!bBusy)nextBanner()}

  const b=document.createElement("div");b.className="banner "+n[1];b.textContent=n[0];document.body.appendChild(b);
  setTimeout(()=>b.remove(),1100);setTimeout(nextBanner,750);

/* ---------- goals ---------- */
function makeGoals(){
  const keys=shuffle(Object.keys(GOALS)).slice(0,3);
  S.goals=keys.map(k=>({k,have:0,done:false,reward:Math.max(20,Math.round(rentToday()*rnd(.25,.4)/5)*5),...GOALS[k]()}));
}
function progress(k,o={}){
  S.goals.forEach((g,i)=>{
    if(g.done||g.k!==k)return;
    if(k==="flipcat"&&g.cat!==o.cat)return;
    if(k==="bigflip"&&o.amt<g.thr)return;
    g.have++;
    if(g.have>=g.need){g.done=true;S.cash+=g.reward;S.dayStats.goals+=g.reward;S.goalsDone++;SFX.goal();buzz(15);banner("Goal +"+fmt(g.reward),"a")}

  });
}

function reject(el,msg){el.classList.remove("nope");void el.offsetWidth;el.classList.add("nope");floatAt(el,msg,"var(--down)");SFX.nope();buzz(30)}
function tryBuy(i){
  const l=S.market[i],el=slotEls[i];if(!l||l.gone)return;
  if(l.price>S.cash)return reject(el,"Not enough cash");

  const off=l.cat&&l.kind!=="mystery"?1-l.price/(l.base*S.trend[l.cat]):0;
  S.cash-=l.price;S.dayStats.spent+=l.price;
  const item=l.kind==="mystery"?openBox(l.price):{cat:l.cat,code:l.code,name:l.name,cond:l.cond,base:l.base,noise:rnd(.95,1.05),fake:l.fake};
  item.paid=l.price;S.stash.push(item);

    banner(v>l.price*2.5?"Jackpot":"Box opened",v>l.price*2.5?"g":"a");progress("mystery");

  else if(l.kind==="grail"){S.grails++;SFX.grail();banner("Grail secured","g")}

/* ---------- selling ---------- */
function sellAt(i,v,{hot=false,el=null}={}){
  const s=S.stash[i];v=Math.round(v);
  const gain=v-s.paid;let bonus=0;
  if(gain>0){S.streak=(S.t-S.streakT<4)?S.streak+1:1;S.streakT=S.t;bonus=Math.round(gain*Math.min(.1*(S.streak-1),.5))}
  else S.streak=0;
  S.cash+=v+bonus;S.dayStats.sales+=v;S.dayStats.bonus+=bonus;S.flips++;S.totalProfit+=gain+bonus;
  S.bestFlip=Math.max(S.bestFlip,gain+bonus);
  S.stash.splice(i,1);
  if(el)floatAt(el,(gain>=0?"+":"−")+"$"+Math.abs(gain+bonus).toLocaleString()+(bonus?`<small>STREAK ×${(1+Math.min(.1*(S.streak-1),.5)).toFixed(1)}</small>`:hot?"<small>COLLECTOR</small>":""),gain>=0?"var(--up)":"var(--down)");
  if(gain>0){SFX.sell(S.streak);buzz(12)}else{SFX.loss();buzz(35)}
  if(hot){S.ev=null;S.nextEv=rnd(2,4);SFX.hot();banner("Sold to collector","g")}
  else if(gain>=s.paid&&s.paid>0)banner("Doubled up","a");
  else if(S.streak===5)banner("On fire","a");
  if(gain>0)progress("flipcat",{cat:s.cat});
  progress("bigflip",{amt:gain+bonus});
  if(hot)progress("collector");
  if(S.streak>=4)progress("streak");
  renderStash();renderEvent();
}

function tickEvent(dt){

$("event").addEventListener("click",e=>{

/* ---------- loop ---------- */
let last=0,drift=0;
function tick(now){
  if(!S.running){last=0;return}
  const dt=last?Math.min(.1,(now-last)/1000):0;last=now;S.t+=dt;
  if(hold){
    const l=S.market[hold.i];
    if(!l||l.id!==hold.id||l.gone)hold=null;
    else if(!hold.active&&now-hold.t0>170)hold.active=true;
    if(hold&&hold.active){
      hold.acc+=dt;
      while(hold&&hold.acc>=.09){
        hold.acc-=.09;
        l.disc=Math.min(.6,l.disc+.02);l.price=Math.max(1,Math.round(l.ask*(1-l.disc)));
        SFX.tick(l.disc);
        const risk=Math.max(0,l.disc-.06)*.16*(1-.35*S.perk.tongue);
        if(Math.random()<risk){l.gone=.8;hold=null;SFX.walk();buzz([20,40,20])}
      }
    }
  }
  for(let i=0;i<feedSize();i++){
    const l=S.market[i];
    if(l){
      if(l.gone){l.gone-=dt;if(l.gone<=0){S.market[i]=null;S.restock[i]=rnd(.3,.8)}}
      else if(!(hold&&hold.i===i&&hold.active)){l.left-=dt;if(l.left<=0){S.market[i]=null;S.restock[i]=rnd(.2,.6)}}
    }else{S.restock[i]-=dt;if(S.restock[i]<=0)S.market[i]=newListing()}
  }
  if(S.ev){const was=S.ev;tickEvent(dt);if(S.ev===was)renderEvent()}
  else{S.nextEv-=dt;if(S.nextEv<=0){spawnEvent();renderEvent()}}
  drift+=dt;S.newsT-=dt;
  if(drift>=.5){drift=0;
    const amp=modIs("wild")?.11:.055;
    CATS.forEach(c=>{const t=S.trend[c.k]+rnd(-amp,amp)+(1-S.trend[c.k])*.035;S.trend[c.k]=Math.min(1.85,Math.max(.5,t))});
    if(Math.random()<(modIs("wild")?.09:.045)){
      const k=pick(S.unlocked),boom=Math.random()<.55;
      S.trend[k]=boom?Math.min(1.85,S.trend[k]+.4):Math.max(.5,S.trend[k]-.35);
      setNews(`<b class="${boom?"u":"d"}">${CAT[k].n} ${boom?"▲":"▼"}</b> ${pick(NEWS[k][boom?0:1])}`);S.newsT=5;SFX.news();
    }else if(S.newsT<=0){setNews(summary());S.newsT=4}
    CATS.forEach(c=>{const h=S.hist[c.k];h.push(S.trend[c.k]);h.shift()});
    renderStash();
  }
  updateMarket();renderHud(dt);
  if(S.t>=S.dayLen){endDay();return}
  requestAnimationFrame(tick);
}

/* ---------- days ---------- */
function startDay(){
  S.newMarket=null;
  if(S.day>1){const nx=ORDER.find(k=>!S.unlocked.includes(k));if(nx){S.unlocked.push(nx);S.newMarket=nx}}
  S.t=0;S.dayLen=45+S.perk.hours*10-(modIs("chill")?10:0);
  if(modIs("hype"))S.trend[S.mod.cat]=Math.min(1.85,S.trend[S.mod.cat]+.3);
  if(modIs("crash"))CATS.forEach(c=>S.trend[c.k]=Math.max(.5,S.trend[c.k]*.75));
  S.ev=null;S.nextEv=rnd(3,5);S.auctionDone=false;S.streak=0;S.streakT=-99;hold=null;evKey=null;
  S.dayStats={sales:0,spent:0,bonus:0,goals:0};

}

function repPanel(earned){
  const lv=repLevel(rep),nx=LEGACY[lv],prev=lv?LEGACY[lv-1][0]:0;
  const pct=nx?Math.min(100,(rep-prev)/(nx[0]-prev)*100):100;
  return `<div class="rep"><div class="row"><span class="lv">Reputation ${lv}</span><span class="mono">${rep} rep${earned?` · +${earned}`:""}</span></div>
    <div class="repbar"><i style="width:${pct}%"></i></div>
    <div class="row"><span>${nx?`Next at ${nx[0]}: ${nx[1]}`:"Every legacy bonus unlocked"}</span></div></div>`;
}

/* ---------- fit phones showing the desktop layout ---------- */
// iPhone "desktop website" mode ignores the viewport tag and lays the page out ~980px wide,
// shrinking the game to ~40%. Detect a touch screen whose layout is much wider than the
// device and zoom the page back up to fill it.
const root=document.documentElement;
function cssScale(){const w=root.offsetWidth;return w?root.getBoundingClientRect().width/w:1}
function fitScreen(){
  root.style.zoom="";root.style.height="";
  const sw=Math.min(screen.width,screen.height)>0&&innerWidth<innerHeight?Math.min(screen.width,screen.height):screen.width;
  if(!matchMedia("(pointer:coarse)").matches||!sw||innerWidth<=sw*1.15)return;
  const z=innerWidth/sw;root.style.zoom=z;root.style.height=(innerHeight/z)+"px";
}
fitScreen();addEventListener("resize",fitScreen);

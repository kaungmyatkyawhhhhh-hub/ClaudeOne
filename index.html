<title>Flip Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400..700&display=swap">
<style>
/* Layout: one-screen shop sim. HUD on top, a live illustrated shop scene where customers queue, and a deal panel below that switches between face-to-face haggling and your stock. */
:root{
  --bg:#eceef2; --surface:#ffffff; --sunk:#e2e5ea; --ink:#0d1015; --muted:#677080; --line:#d8dce3;
  --accent:#2a3cff; --accent-ink:#ffffff; --up:#08965a; --down:#df2f45; --gold:#b97c00;
  --tl:.93; --tc:.05; --tt:.38; --shadow:0 1px 0 rgba(13,16,21,.04),0 8px 24px -12px rgba(13,16,21,.18);
  --sc-sky:#d9e3f3; --sc-far:#c2cde0; --sc-ground:#c5cad5; --sc-line:#f2f4f8; --sc-wall:#e2e6ee; --sc-wood:#c79f78; --sc-wood2:#b08660;
  --sc-car:#3a4668; --sc-car2:#4a5880; --sc-dark:#262c3b; --sc-metal:#9aa3b3; --sc-kraft:#c99a62; --sc-awn2:#ffffff; --sc-glass:rgba(255,255,255,.55); --sc-light:rgba(255,236,170,.35);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d11; --surface:#14171d; --sunk:#1b1f27; --ink:#eff2f6; --muted:#8a93a4; --line:#242a34;
  --accent:#6d7bff; --accent-ink:#0b0d11; --up:#2fd28a; --down:#ff5b6e; --gold:#ffc24a;
  --tl:.31; --tc:.06; --tt:.86; --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7);
  --sc-sky:#141a29; --sc-far:#1c2436; --sc-ground:#1a1e28; --sc-line:#2d3445; --sc-wall:#181d28; --sc-wood:#5b4431; --sc-wood2:#4a3727;
  --sc-car:#28324d; --sc-car2:#323e5e; --sc-dark:#0c0f16; --sc-metal:#465063; --sc-kraft:#7b5b38; --sc-awn2:#2a3040; --sc-glass:rgba(140,160,200,.18); --sc-light:rgba(255,220,140,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d11; --surface:#14171d; --sunk:#1b1f27; --ink:#eff2f6; --muted:#8a93a4; --line:#242a34;
  --accent:#6d7bff; --accent-ink:#0b0d11; --up:#2fd28a; --down:#ff5b6e; --gold:#ffc24a;
  --tl:.31; --tc:.06; --tt:.86; --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7);
  --sc-sky:#141a29; --sc-far:#1c2436; --sc-ground:#1a1e28; --sc-line:#2d3445; --sc-wall:#181d28; --sc-wood:#5b4431; --sc-wood2:#4a3727;
  --sc-car:#28324d; --sc-car2:#323e5e; --sc-dark:#0c0f16; --sc-metal:#465063; --sc-kraft:#7b5b38; --sc-awn2:#2a3040; --sc-glass:rgba(140,160,200,.18); --sc-light:rgba(255,220,140,.12); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
[hidden]{display:none!important}
#app{height:100%;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* HUD */
.top{display:flex;flex-direction:column;gap:7px}
.row1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cash{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:800;font-size:2.3rem;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .25s}
.cash.gain{color:var(--up)}
.right{display:flex;align-items:center;gap:8px}
.daypill{font-family:var(--mono);font-size:.78rem;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.daypill .clk{color:var(--muted)} .daypill.low .clk{color:var(--down)}
.iconbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.iconbtn svg{width:16px;height:16px}
.clock{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.clock i{display:block;height:100%;background:var(--ink);transform-origin:left;width:100%}
.clock.low i{background:var(--down)}
.rentline{display:flex;align-items:center;gap:10px;font-size:.76rem;color:var(--muted)}
.rentline b{color:var(--ink);font-family:var(--mono);font-weight:600}
.rentbar{flex:1;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.rentbar i{display:block;height:100%;width:0;background:var(--down);border-radius:6px;transition:width .3s,background .3s}
.rentbar.ok i{background:var(--up)}
#rentState{font-family:var(--mono);font-weight:600;min-width:9ch;text-align:right}

/* News */
.news{display:flex;align-items:center;gap:10px;height:28px;padding:0 12px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;font-size:.78rem;flex:none}
.live{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;color:var(--down);display:flex;align-items:center;gap:5px;flex:none}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#news{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#news.in{animation:slidein .35s ease-out}
#news b.u{color:var(--up)} #news b.d{color:var(--down)}
@keyframes slidein{from{transform:translateY(100%);opacity:0}}

/* Scene */
.scene{position:relative;flex:none;height:clamp(196px,32vh,270px);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--sc-sky)}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s-sky{fill:var(--sc-sky)} .s-far{fill:var(--sc-far)} .s-ground{fill:var(--sc-ground)} .s-line{fill:var(--sc-line)} .s-wall{fill:var(--sc-wall)}
.s-wood{fill:var(--sc-wood)} .s-wood2{fill:var(--sc-wood2)} .s-car{fill:var(--sc-car)} .s-car2{fill:var(--sc-car2)} .s-dark{fill:var(--sc-dark)} .s-metal{fill:var(--sc-metal)}
.s-kraft{fill:var(--sc-kraft)} .s-awn{fill:var(--accent)} .s-awn2{fill:var(--sc-awn2)} .s-glass{fill:var(--sc-glass)} .s-light{fill:var(--sc-light)} .s-gold{fill:var(--gold)}
.s-neon{fill:var(--accent);font-family:var(--display);font-weight:900;font-variation-settings:"wdth" 125;letter-spacing:-.02em}
.s-neon-glow{filter:drop-shadow(0 0 6px var(--accent))}
.loc{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:2px;z-index:3}
.loc b{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:.8rem;text-transform:uppercase;background:var(--surface);padding:4px 8px;border-radius:7px;box-shadow:var(--shadow);width:max-content}
.nextloc{position:absolute;top:10px;right:10px;z-index:3;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:5px 8px;font-size:.62rem;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:96px}
.nextloc span b{color:var(--ink);font-family:var(--mono)}
.nextloc i{display:block;height:3px;border-radius:3px;background:var(--sunk);overflow:hidden}
.nextloc i::after{content:"";display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--accent)}
.shelf{position:absolute;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;z-index:1}
.shelf .tile{width:24px;height:24px;border-radius:6px;font-size:.55rem;box-shadow:0 2px 4px rgba(0,0,0,.18)}
.shelf .more{font-family:var(--mono);font-size:.6rem;font-weight:700;color:var(--ink);background:var(--surface);border-radius:6px;padding:0 5px;height:24px;display:grid;place-items:center}
.staffrow{position:absolute;left:6px;bottom:0;display:flex;align-items:flex-end;z-index:2}
.staff{width:44px;display:flex;flex-direction:column;align-items:center;margin-right:-6px}
.staff .av{width:44px;height:53px}
.staff small{font-size:.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:1px 4px;border-radius:4px;margin-bottom:-2px;position:relative;z-index:1;white-space:nowrap}
.queue{position:absolute;right:8px;bottom:-4px;display:flex;align-items:flex-end;flex-direction:row-reverse;z-index:2}
.cust{position:relative;width:70px;display:flex;flex-direction:column;align-items:center;margin-left:4px;transition:transform .2s;animation:walkin .45s cubic-bezier(.2,.8,.3,1)}
.cust .av{width:70px;height:84px;display:block}
.cust .tag{font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:99px;margin-bottom:3px;white-space:nowrap}
.cust .tag.sell{background:var(--gold);color:#1b1200}
.cust .tag.buy{background:var(--accent);color:var(--accent-ink)}
.cust .pat{width:40px;height:4px;border-radius:4px;background:rgba(0,0,0,.18);overflow:hidden;margin-bottom:3px}
.cust .pat i{display:block;height:100%;background:var(--up);transform-origin:left}
.cust .pat.low i{background:var(--down)}
.cust.serving{transform:translateY(-6px)}
.cust.serving .av{filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
.cust.serving .tag{outline:2px solid var(--ink);outline-offset:1px}
.cust.leave{animation:walkout .6s forwards}
.cust .reg{position:absolute;top:-2px;right:6px;font-size:.6rem;color:var(--down)}
@keyframes walkin{from{transform:translateX(80px);opacity:0}}
@keyframes walkout{to{transform:translateX(90px);opacity:0}}
.hintpulse{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:4px 9px;border-radius:99px;animation:hp 1s infinite alternate;pointer-events:none;white-space:nowrap}
@keyframes hp{to{transform:translateX(-50%) translateY(-3px)}}

/* Panel */
.panel{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.panel::-webkit-scrollbar{display:none}
.sechead{display:flex;align-items:baseline;gap:10px}
.sechead h3{margin:0;font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:.95rem;letter-spacing:-.01em;text-transform:uppercase}
.sechead .eyebrow{margin-left:auto;letter-spacing:.06em;text-transform:none;font-size:.72rem}
.tile{--h:250;flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:oklch(var(--tl) var(--tc) var(--h));color:oklch(var(--tt) .13 var(--h));font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:.95rem;letter-spacing:-.02em}
.tile.sm{width:34px;height:34px;border-radius:8px;font-size:.78rem}
.stock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.itm{position:relative;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);min-width:0;align-items:center}
.itm .iv{display:flex;flex-direction:column;min-width:0}
.bid{font-family:var(--mono);font-weight:700;font-size:1rem}
.pl{font-family:var(--mono);font-size:.66rem;font-weight:600}
.itm.up .pl{color:var(--up)} .itm.down .pl{color:var(--down)}
.inm{grid-column:1/-1;font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itm .fc{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.6rem;font-weight:700;color:#fff;background:var(--down);padding:2px 6px;border-radius:99px}
.itm .qs{display:none;grid-column:1/-1;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px;border-radius:8px;background:var(--ink);color:var(--bg);text-align:center}
.itm.sel{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.itm.sel .qs{display:block}
.slot0{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--muted);font-size:.7rem;min-height:72px}
.empty-hint{font-size:.84rem;color:var(--muted);line-height:1.45;padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}

/* Deal card */
.deal{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px 12px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.dhead{display:flex;align-items:center;gap:10px}
.dhead .av{width:46px;height:55px;flex:none;background:var(--sunk);border-radius:12px}
.dwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dwho b{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:800;font-size:1.05rem}
.dwho span{font-size:.72rem;color:var(--muted)}
.hearts{font-size:.72rem;color:var(--down);letter-spacing:1px}
.hearts i{font-style:normal;color:var(--line)}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dots i.off{background:var(--line)}
.bubble{position:relative;background:var(--sunk);border-radius:12px;padding:9px 12px;font-size:.9rem;line-height:1.35;font-weight:500}
.bubble::before{content:"";position:absolute;top:-6px;left:18px;width:12px;height:12px;background:var(--sunk);transform:rotate(45deg)}
.bubble.pop{animation:pulse .35s}
.ditem{display:flex;align-items:center;gap:10px}
.ditem .dn{flex:1;min-width:0}
.ditem .dn b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .dn span{font-size:.72rem;color:var(--muted)}
.cond{font-family:var(--mono);font-size:.6rem;font-weight:600;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--ink);margin-right:4px}
.mkt{text-align:right;flex:none}
.mkt small{display:block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mkt b{font-family:var(--mono);font-size:.95rem}
.warn{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--down)}
.fk{font-family:var(--mono);font-size:.58rem;font-weight:700;color:#fff;background:var(--down);padding:1px 5px;border-radius:4px}
.offer{display:flex;flex-direction:column;gap:2px}
.offer .orow{display:flex;justify-content:space-between;align-items:baseline}
.offer .orow b{font-family:var(--mono);font-size:1.35rem;font-weight:700;margin-left:4px}
.offer .orow span{font-family:var(--mono);font-size:.74rem;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--accent) calc(var(--f,50)*1%),var(--sunk) 0)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--sunk)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-10px;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.dbtns{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px}
.dbtn{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:13px 10px;border-radius:12px;text-align:center;white-space:nowrap}
.dbtn.walk{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.dbtn.counter{background:var(--accent);color:var(--accent-ink)}
.dbtn.deal{background:var(--ink);color:var(--bg)}
.dbtn[disabled]{opacity:.35}
.dbtn:active{transform:scale(.97)}

/* FX */
.float{position:fixed;pointer-events:none;z-index:40;font-family:var(--mono);font-weight:700;font-size:1.15rem;animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.float small{display:block;font-size:.6rem;letter-spacing:.08em;text-align:center}
@keyframes rise{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{transform:translate(-50%,-8px) scale(1.1);opacity:1}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.banner{position:fixed;left:50%;top:34%;z-index:41;pointer-events:none;font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:2.2rem;letter-spacing:-.03em;text-transform:uppercase;color:var(--ink);white-space:nowrap;animation:ban 1.1s cubic-bezier(.2,.8,.2,1) forwards;text-shadow:0 2px 0 var(--bg)}
.banner.g{color:var(--gold)} .banner.a{color:var(--accent)} .banner.r{color:var(--down)} .banner.u{color:var(--up)}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(1.6);opacity:0;filter:blur(6px)}18%{transform:translate(-50%,-50%) scale(1);opacity:1;filter:none}75%{opacity:1}100%{transform:translate(-50%,-60%);opacity:0}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes up{from{transform:translateY(12px);opacity:0}}

/* Overlay screens */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in oklab,var(--bg) 95%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;overflow-y:auto;padding-inline:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:420px;margin:auto 0;display:flex;flex-direction:column;gap:16px;animation:up .4s cubic-bezier(.2,.8,.2,1)}
.wordmark{font-family:var(--display);font-variation-settings:"wdth" 125;font-weight:900;font-size:clamp(4rem,22vw,6.2rem);line-height:.82;letter-spacing:-.055em;margin:0}
.wordmark span{display:block;color:var(--accent)}
.lede{font-size:1.02rem;line-height:1.45;color:var(--muted);margin:0;max-width:32ch}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.1rem;text-transform:uppercase;letter-spacing:-.01em;padding:17px 20px;border-radius:14px;transition:transform .1s}
.cta small{font-family:var(--mono);font-size:.7rem;font-weight:600;text-transform:none;letter-spacing:0;opacity:.7;display:block;margin-top:2px}
.cta:active{transform:scale(.98)}
.cta svg{width:22px;height:22px;flex:none}
.cta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-size:.95rem;padding:14px 20px}
.fine{font-size:.76rem;color:var(--muted);text-align:center;margin:0}
.h2{font-family:var(--display);font-variation-settings:"wdth" 120;font-weight:900;font-size:2.3rem;line-height:.9;letter-spacing:-.04em;margin:0;text-transform:uppercase}
.h2 small{display:block;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.stmt{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 16px;font-size:.88rem}
.stmt div{display:flex;justify-content:space-between;padding:9px 0}
.stmt div+div{border-top:1px dashed var(--line)}
.stmt span:last-child{font-family:var(--mono);font-weight:600}
.stmt .tot{font-weight:700;font-size:1rem}
.pos{color:var(--up)} .neg{color:var(--down)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 div{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.grid2 b{display:block;font-family:var(--mono);font-size:1.2rem;font-weight:700;margin-top:4px}
.perks{display:flex;flex-direction:column;gap:6px}
.perk{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.perk .pa{grid-row:1/3;width:40px;height:48px}
.perk .t{font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.perk .d{font-size:.74rem;color:var(--muted);grid-column:2}
.perk .c{grid-row:1/3;grid-column:3;font-family:var(--mono);font-weight:700;font-size:.82rem;padding:8px 11px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-align:center}
.perk .c small{display:block;font-size:.58rem;opacity:.8}
.perk.nopic{grid-template-columns:1fr auto}
.perk.nopic .d{grid-column:1} .perk.nopic .c{grid-column:2}
.perk[disabled]{box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.perk[disabled] .c{background:var(--sunk);color:var(--muted)}
.perk.bought{animation:pulse .4s}
.pips{display:flex;gap:3px}.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--accent)}
.move{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.move .pv{height:120px;position:relative}
.move .pv svg{position:absolute;inset:0;width:100%;height:100%}
.move .mb{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.move .mt{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.1rem;text-transform:uppercase}
.move .md{font-size:.8rem;color:var(--muted);line-height:1.4}
.move .mbtn{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px;border-radius:12px;background:var(--accent);color:var(--accent-ink);text-align:center}
.move .mbtn[disabled]{background:var(--sunk);color:var(--muted)}
.story{display:flex;flex-direction:column;gap:14px}
.story .who{display:flex;align-items:center;gap:12px}
.story .who .av{width:72px;height:86px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.story .who b{font-family:var(--display);font-variation-settings:"wdth" 118;font-weight:800;font-size:1.2rem;text-transform:uppercase}
.story .bubble{font-size:1.02rem;background:var(--surface);box-shadow:var(--shadow);padding:16px 18px}
.story .bubble::before{background:var(--surface);left:30px}
.howto{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.howto div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;font-size:.86rem;line-height:1.35}
.howto div+div{border-top:1px solid var(--line)}
.howto kbd{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);min-width:46px;text-align:center}
.castrow{display:flex;justify-content:space-between}
.castrow .av{width:44px;height:53px}
@media (max-height:700px){#app{gap:8px}.cash{font-size:2rem}.scene{height:clamp(180px,30vh,230px)}}

function tone(f,d,{type="sine",vol=.07,to=0,at=0}={}){
  if(!ac||muted)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.03);
}

/* ================= state ================= */
let S=null;
function newGame(){
  S={v:1,cash:150,day:1,tier:0,stock:[],fx:{shelf:0,display:0,neon:0,couch:0},staff:{},hearts:{},trend:{},hist:{},flags:{},
     stats:{deals:0,profit:0,best:0,fakes:0,walkouts:0},nextId:1};
  CATS.forEach(c=>{S.trend[c.k]=1;S.hist[c.k]=Array(30).fill(1)});
}
function save(){if(S)store.set(SAVE,JSON.stringify(S))}
function load(){try{const d=JSON.parse(store.get(SAVE));if(d&&d.v===1){S=d;return true}}catch(e){}return false}
// Per-day, not saved
let D=null;
const tier=()=>TIERS[S.tier];
const maxSlots=()=>tier().slots+S.fx.shelf*2;
const wages=()=>STAFF.reduce((a,s)=>a+(S.staff[s.k]?s.wage:0),0);
const dueTonight=()=>tier().rent+wages();
const valueOf=it=>it.base*S.trend[it.cat]*it.noise*(it.fake?.12:1);
const stockVal=()=>S.stock.reduce((a,it)=>a+valueOf(it),0);
const netWorth=()=>S.cash+stockVal();
const heartsOf=id=>id?(S.hearts[id]||0):0;

/* ================= customers ================= */
function genItem(){
  const cap=tier().cap,pool=POOL.filter(p=>p.base<=cap&&p.base>=cap*.03);
  const p=pick(pool),c=CAT[p.cat],cond=pick(c.conds);
  return {id:S.nextId++,cat:p.cat,code:p.code,name:p.name,cond:cond[0],base:Math.round(p.base*cond[1]),noise:rnd(.95,1.05),fake:false};
}
function spawnCustomer(){
  if(D.queue.length>=tier().queue)return;
  const n=S.stock.filter(it=>!D.queue.some(q=>q.item===it)).length;
  let role=n===0?"sell":S.stock.length>=maxSlots()?"buy":Math.random()<.2+.6*S.stock.length/maxSlots()?"buy":"sell";
  const busy=D.queue.map(q=>q.cid);
  const regs=CAST.filter(r=>!busy.includes(r.id)&&(r.type==="rival"||TYPES[r.type].role===role));
  let who;
  if(regs.length&&Math.random()<.38){const r=pick(regs);who={cid:r.id,name:r.name,look:r.look,type:r.type==="rival"?(role==="sell"?"rivalS":"rivalB"):r.type}}
  else{
    const w={};for(const[k,t]of Object.entries(TYPES))if(t.role===role&&t.w)w[k]=t.w*(k==="collector"&&S.staff.social?2:1);
    who={cid:null,name:pick(NAMES),look:randLook(),type:wpick(w)};
  }
  const T=TYPES[who.type],h=heartsOf(who.cid);
  const c={id:S.nextId++,...who,role,mood:"ok",pat:T.pat,patMax:T.pat,wait:0,waitMax:rnd(13,19)*T.wait*(1+.3*S.fx.couch),leaving:false};
  if(role==="sell"){
    const it=genItem();const v=valueOf(it);
    if(T.fake&&Math.random()<T.fake)it.fake=true;
    c.item=it;c.price=r5(v*rnd(...T.ask)*(1-.04*h)*(S.staff.scout?.9:1));c.res=r5(c.price*rnd(...T.res));
    c.line=T.say.hi(fmt(c.price));
  }else{
    const free=S.stock.filter(it=>!D.queue.some(q=>q.item===it));
    const pref=T.prefer?free.filter(it=>T.prefer.includes(it.cat)):[];
    const it=pick(pref.length&&Math.random()<.75?pref:free);
    const v=valueOf(it);
    c.item=it;c.price=r5(v*rnd(...T.offer)*(1+.04*h)*(1+.1*S.fx.display));c.res=r5(c.price*rnd(...T.res));
    c.line=T.say.hi(fmt(c.price),it.name);
  }
  c.wait=c.waitMax;D.queue.push(c);SFX.door();renderQueue();
}
function custLeave(c,mood,line){
  c.leaving=true;c.mood=mood;if(line)c.line=line;
  if(D.deal&&D.deal.c===c)D.deal=null;
  renderQueue();renderPanel();
  setTimeout(()=>{D.queue=D.queue.filter(q=>q!==c);renderQueue()},600);
}

/* ================= haggling ================= */
function openDeal(c){
  if(c.leaving)return;
  if(D.deal&&D.deal.c===c)return;
  D.deal={c,offer:defaultOffer(c)};audioOn();renderQueue();renderPanel();
}
function rangeFor(c){return c.role==="sell"?[r5(c.price*.3),c.price]:[c.price,r5(c.price*1.9)]}
function defaultOffer(c){return c.role==="sell"?r5(c.price*.72):r5(c.price*1.22)}
function adjustHearts(c,d){if(!c.cid)return;S.hearts[c.cid]=clamp((S.hearts[c.cid]||0)+d,0,5)}
function closeDeal(c,price){
  if(c.role==="sell"){
    if(price>S.cash){SFX.nope();flash("Not enough cash");return}
    if(S.stock.length>=maxSlots()){SFX.nope();flash("Your shelves are full");return}
    S.cash-=price;D.spent+=price;
    const it={...c.item,paid:price};S.stock.push(it);
    floatAt($("cash"),fmt(-price),"var(--ink)");
    if(it.fake){S.stats.fakes++;setTimeout(()=>{SFX.fake();banner("It's a fake","r");if(!S.flags.fake){S.flags.fake=1;D.pendingStory="fake"}},300)}
    else SFX.buy();
  }else{
    const i=S.stock.indexOf(c.item);if(i<0){custLeave(c,"meh","Oh, it already sold.");return}
    S.stock.splice(i,1);S.cash+=price;D.sales+=price;
    const gain=price-c.item.paid;D.profit+=gain;S.stats.profit+=gain;S.stats.best=Math.max(S.stats.best,gain);
    floatAt($("cash"),(gain>=0?"+":"−")+"$"+Math.abs(gain).toLocaleString()+"<small>PROFIT</small>",gain>=0?"var(--up)":"var(--down)");
    gain>=0?SFX.sell():SFX.loss();
    if(gain>=c.item.paid&&c.item.paid>0)banner("Doubled up","u");
  }
  S.stats.deals++;D.deals++;
  adjustHearts(c,c.pat===c.patMax?1:c.pat>0?1:0);
  buzz(12);custLeave(c,"happy",TYPES[c.type].say.yes);
}
function counter(){
  const dl=D.deal;if(!dl)return;const c=dl.c,T=TYPES[c.type],x=dl.offer;
  const ok=c.role==="sell"?x>=c.res:x<=c.res;
  if(ok)return closeDeal(c,x);
  const gap=c.role==="sell"?(c.res-x)/c.res:(x-c.res)/c.res;
  c.pat-=gap>.35?2:1;
  if(c.pat<=0){adjustHearts(c,-1);S.stats.walkouts++;SFX.walk();return custLeave(c,"mad",T.say.mad)}
  const move=(c.role==="sell"?c.price-x:x-c.price)*T.give*rnd(.7,1.2);
  c.price=c.role==="sell"?Math.max(c.res,r5(c.price-move)):Math.min(c.res,r5(c.price+move));
  const close=gap<.12;
  c.mood=close?"ok":"meh";c.line=(close?T.say.close:T.say.far)+` ${fmt(c.price)}?`;
  close?SFX.close():SFX.far();
  dl.offer=clamp(dl.offer,...rangeFor(c));
  renderQueue();renderPanel(true);
}
function walk(){const dl=D.deal;if(!dl)return;const c=dl.c;D.deal=null;renderQueue();renderPanel()}

/* ================= rendering ================= */
const tileFor=(it,cls="")=>`<div class="tile ${cls}" style="--h:${CAT[it.cat].h}">${it.code}</div>`;
let qKey="";
function renderScene(){
  const t=tier(),sh=t.shelf;
  $("scene").innerHTML=sceneSVG(S.tier,S.fx)+
   `<div class="loc"><b>${t.n}</b></div><div class="nextloc" id="nextloc"></div>
    <div class="shelf" id="shelf" style="top:${sh[0]}%;left:${sh[1]}%;width:${sh[2]}%"></div>
    <div class="staffrow" id="staffrow"></div><div class="queue" id="queue"></div><div id="hint"></div>`;
  qKey="";renderShelf();renderStaff();renderNext();renderQueue();
}
function renderShelf(){
  const el=$("shelf");if(!el)return;const max=S.tier===0?4:S.tier<3?8:14;
  el.innerHTML=S.stock.slice(0,max).map(it=>tileFor(it)).join("")+(S.stock.length>max?`<span class="more">+${S.stock.length-max}</span>`:"");
}
function renderStaff(){
  const el=$("staffrow");if(!el)return;
  el.innerHTML=STAFF.filter(s=>S.staff[s.k]).map(s=>`<div class="staff" id="staff-${s.k}"><small>${s.k==="social"?"Social":s.t.split(" ")[0]}</small>${avatar(s.look,"happy")}</div>`).join("");
}
function renderNext(){
  const el=$("nextloc");if(!el)return;const nx=TIERS[S.tier+1];
  if(!nx){el.innerHTML=`<span>Net worth <b>${fmt(netWorth())}</b></span><span>Goal <b>${fmt(WIN)}</b></span><i style="--p:${Math.min(1,netWorth()/WIN)}"></i>`;return}
  el.innerHTML=`<span>Next: <b>${nx.n}</b></span><span>Deposit <b>${fmt(nx.dep)}</b></span><i style="--p:${Math.min(1,S.cash/nx.dep)}"></i>`;
}
function renderQueue(){
  const el=$("queue");if(!el)return;
  const key=D?D.queue.map(c=>c.id+c.mood+(c.leaving?"L":"")+(D.deal&&D.deal.c===c?"S":"")).join("|"):"";
  if(key!==qKey){
    qKey=key;
    el.innerHTML=(D?D.queue:[]).map(c=>`<button class="cust${c.leaving?" leave":""}${D.deal&&D.deal.c===c?" serving":""}" data-id="${c.id}" aria-label="${c.name} wants to ${c.role}">
      <span class="tag ${c.role}">${c.role==="sell"?"SELLING":"BUYING"}</span><span class="pat" id="pat-${c.id}"><i></i></span>
      ${avatar(c.look,c.mood)}${c.cid?`<span class="reg">${"♥".repeat(Math.max(1,heartsOf(c.cid)))}</span>`:""}</button>`).join("");
  }
  const h=$("hint");if(h)h.innerHTML=D&&D.running&&!D.deal&&D.queue.some(c=>!c.leaving)&&S.stats.deals<3?'<span class="hintpulse">Tap a customer</span>':"";
}
function updatePatience(){
  if(!D)return;
  for(const c of D.queue){const p=document.getElementById("pat-"+c.id);if(!p)continue;const f=c.wait/c.waitMax;p.firstChild.style.transform=`scaleX(${Math.max(0,f)})`;p.classList.toggle("low",f<.3)}
}
function renderPanel(bubblePop){
  const el=$("panel");const dl=D&&D.deal;
  if(dl){
    const c=dl.c,T=TYPES[c.type],it=c.item,v=valueOf(it),[mn,mx]=rangeFor(c),h=heartsOf(c.cid);
    const sell=c.role==="sell";
    const knowFake=sell&&it.fake&&S.staff.auth;
    const sketchy=sell&&c.type==="shady"&&!S.staff.auth;
    const realV=sell?it.base*S.trend[it.cat]*it.noise:v;
    el.innerHTML=`<div class="deal">
      <div class="dhead">${avatar(c.look,c.mood)}<div class="dwho"><b>${c.name}</b><span>${T.label} · ${sell?"selling to you":"wants to buy"}</span>${c.cid?`<span class="hearts">${"♥".repeat(h)}<i>${"♥".repeat(5-h)}</i></span>`:""}</div>
        <div class="dots" aria-label="Patience">${Array.from({length:c.patMax},(_,i)=>`<i class="${i<c.pat?"":"off"}"></i>`).join("")}</div></div>
      <div class="bubble${bubblePop?" pop":""}">${c.line}</div>
      <div class="ditem">${tileFor(it)}<div class="dn"><b>${it.name}</b><span><span class="cond">${it.cond}</span>${sell?(knowFake?'<span class="fk">FAKE</span>':sketchy?'<span class="warn">Seems sketchy</span>':""):`paid ${fmt(it.paid)}`}</span></div>
        <div class="mkt"><small>Market</small><b>${fmt(knowFake?v:realV)}</b></div></div>
      <div class="offer"><div class="orow"><span><span class="eyebrow">Your ${sell?"offer":"price"} </span><b id="oval">${fmt(dl.offer)}</b></span><span id="omargin"></span></div>
        <input type="range" id="orange" min="${mn}" max="${mx}" step="5" value="${dl.offer}" aria-label="Your offer"></div>
      <div class="dbtns"><button class="dbtn walk" id="bWalk">Later</button><button class="dbtn counter" id="bCounter"></button><button class="dbtn deal" id="bDeal">${sell?"Buy":"Sell"} ${fmt(c.price)}</button></div>
    </div>`;
    const rg=$("orange");
    const sync=()=>{dl.offer=+rg.value;rg.style.setProperty("--f",((dl.offer-mn)/Math.max(1,mx-mn)*100).toFixed(1));$("oval").textContent=fmt(dl.offer);
      $("bCounter").textContent=(sell?"Offer ":"Ask ")+fmt(dl.offer);
      const ref=sell?realV:dl.offer-it.paid,m=$("omargin");
      if(sell){const p=Math.round((1-dl.offer/realV)*100);m.textContent=(p>=0?p+"% under market":-p+"% over market");m.style.color=p>=0?"var(--up)":"var(--down)"}
      else{m.textContent=(ref>=0?"+":"−")+fmt(Math.abs(ref)).slice(0)+" profit";m.style.color=ref>=0?"var(--up)":"var(--down)"}
      $("bDeal").disabled=sell&&(c.price>S.cash||S.stock.length>=maxSlots());};
    rg.oninput=sync;sync();if(!bubblePop)el.scrollTop=0;
    $("bCounter").onclick=counter;$("bDeal").onclick=()=>closeDeal(c,c.price);$("bWalk").onclick=walk;
    return;
  }
  const n=S.stock.length,max=maxSlots();
  let h=`<div class="sechead"><h3>Your stock</h3><span class="eyebrow">${n}/${max} slots</span></div>`;
  if(!n)h+=`<div class="empty-hint">Nothing on the shelf yet. Buy from customers marked <b style="color:var(--gold)">SELLING</b>, then sell to customers marked <b style="color:var(--accent)">BUYING</b>.</div>`;
  else{
    h+=`<div class="stock">`+S.stock.map((it,i)=>{const v=valueOf(it),pct=(v-it.paid)/Math.max(1,it.paid);
      return `<button class="itm ${pct>=0?"up":"down"}${D&&D.sel===it.id?" sel":""}" data-i="${i}">${tileFor(it,"sm")}<div class="iv"><span class="bid">${fmt(v)}</span><span class="pl">${pct>=0?"+":"−"}${Math.abs(Math.round(pct*100))}% · paid ${fmt(it.paid)}</span></div>
      <div class="inm">${it.name} · ${it.cond}</div>${it.fake?'<span class="fc">FAKE</span>':""}<span class="qs" data-qs="${i}">Sell to resale app · ${fmt(v*.8)}</span></button>`}).join("")+`</div>`;
    h+=`<p class="fine">Tap an item to dump it on the resale app for 80% of market.</p>`;
  }
  el.innerHTML=h;
}
$("panel").addEventListener("click",e=>{
  if(!D||D.deal||!D.running)return;
  const qs=e.target.closest("[data-qs]");
  if(qs){const it=S.stock[+qs.dataset.qs];if(!it)return;const v=Math.round(valueOf(it)*.8);
    S.stock.splice(S.stock.indexOf(it),1);S.cash+=v;D.sales+=v;D.profit+=v-it.paid;S.stats.profit+=v-it.paid;
    D.queue.filter(c=>c.item===it&&c.role==="buy").forEach(c=>custLeave(c,"meh","Oh, it already sold."));
    floatAt(qs,"+"+fmt(v).slice(0),"var(--up)");SFX.sell();D.sel=null;renderPanel();renderShelf();return}
  const b=e.target.closest(".itm");if(!b)return;const it=S.stock[+b.dataset.i];D.sel=D.sel===it.id?null:it.id;renderPanel();
});
$("scene").addEventListener("click",e=>{
  const b=e.target.closest(".cust");if(!b||!D||!D.running)return;
  const c=D.queue.find(q=>q.id===+b.dataset.id);if(c)openDeal(c);
});

let lastClock=-1;
function renderHud(dt){
  const diff=S.cash-D.shown;D.shown=Math.abs(diff)<1?S.cash:D.shown+diff*Math.min(1,dt*10);
  const ce=$("cash");ce.textContent=fmt(D.shown);ce.classList.toggle("gain",diff>1);
  $("day").textContent=S.day;
  const left=Math.max(0,D.len-D.t),sec=Math.ceil(left);
  $("clk").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
  const low=left<10;$("daypill").classList.toggle("low",low);$("clock").classList.toggle("low",low);
  if(low&&D.running&&sec!==lastClock&&sec>0)SFX.count();lastClock=sec;
  $("clockBar").style.transform=`scaleX(${left/D.len})`;
  const due=dueTonight(),ok=S.cash>=due;
  $("rentLbl").textContent=wages()?"Rent + wages":"Rent";$("rent").textContent=fmt(due);
  $("rentFill").style.width=Math.min(100,S.cash/due*100)+"%";$("rentbar").classList.toggle("ok",ok);
  const rs=$("rentState");rs.textContent=ok?"Covered":"Short "+fmt(due-S.cash);rs.style.color=ok?"var(--up)":"var(--down)";
}
function setNews(html){const n=$("news");n.innerHTML=html;n.classList.remove("in");void n.offsetWidth;n.classList.add("in")}
const summary=()=>CATS.map(c=>{const p=Math.round((S.trend[c.k]-1)*100);return `${c.n} <b class="${p>=0?"u":"d"}">${p>=0?"▲":"▼"}${Math.abs(p)}%</b>`}).join(" · ");
const root=document.documentElement;
function cssScale(){const w=root.offsetWidth;return w?root.getBoundingClientRect().width/w:1}
function floatAt(el,html,color){
  const r=el.getBoundingClientRect(),f=document.createElement("div"),k=cssScale();
  f.className="float";f.innerHTML=html;f.style.color=color;f.style.left=(r.left+r.width/2)/k+"px";f.style.top=(r.top+r.height*.3)/k+"px";
  document.body.appendChild(f);setTimeout(()=>f.remove(),900);
}
function flash(msg){const b=$("bDeal");floatAt(b||$("cash"),msg,"var(--down)");buzz(30)}
const bq=[];let bBusy=false;
function banner(t,cls=""){bq.push([t,cls]);if(!bBusy)nextBanner()}
function nextBanner(){const n=bq.shift();if(!n){bBusy=false;return}bBusy=true;const b=document.createElement("div");b.className="banner "+n[1];b.textContent=n[0];document.body.appendChild(b);setTimeout(()=>b.remove(),1100);setTimeout(nextBanner,750)}

/* ================= loop ================= */
let last=0,drift=0;
function tick(now){
  if(!D||!D.running){last=0;return}
  const dt=last?Math.min(.1,(now-last)/1000):0;last=now;D.t+=dt;
  // arrivals
  D.nextCust-=dt;
  if(D.nextCust<=0&&D.t<D.len-4){spawnCustomer();D.nextCust=rnd(2.6,4.6)/(1+.25*S.fx.neon+(S.staff.social?.3:0))}
  // patience
  for(const c of D.queue){if(c.leaving||(D.deal&&D.deal.c===c))continue;c.wait-=dt;if(c.wait<=0){S.stats.walkouts++;custLeave(c,"mad",TYPES[c.type].say.bye)}}
  // assistant
  if(S.staff.assistant){D.asst-=dt;if(D.asst<=0){D.asst=14;
    const busy=D.queue.map(c=>c.item);const it=S.stock.find(x=>!busy.includes(x));
    if(it){const v=Math.round(valueOf(it)*.92);S.stock.splice(S.stock.indexOf(it),1);S.cash+=v;D.sales+=v;D.profit+=v-it.paid;S.stats.profit+=v-it.paid;
      const a=$("staff-assistant");if(a)floatAt(a,"+"+fmt(v).slice(1).replace(/^/,"$")+"<small>ASSISTANT</small>","var(--up)");SFX.sell();renderShelf();if(!D.deal)renderPanel()}}}
  // market
  drift+=dt;D.newsT-=dt;
  if(drift>=1){drift=0;
    CATS.forEach(c=>{S.trend[c.k]=clamp(S.trend[c.k]+rnd(-.03,.03)+(1-S.trend[c.k])*.02,.55,1.8)});
    if(Math.random()<.03){const c=pick(CATS),boom=Math.random()<.55;S.trend[c.k]=boom?Math.min(1.8,S.trend[c.k]+.3):Math.max(.55,S.trend[c.k]-.25);
      setNews(`<b class="${boom?"u":"d"}">${c.n} ${boom?"▲":"▼"}</b> ${pick(NEWS[c.k][boom?0:1])}`);D.newsT=6;SFX.news();if(!D.deal)renderPanel()}
    else if(D.newsT<=0){setNews(summary());D.newsT=5}
    renderNext();
  }
  updatePatience();renderHud(dt);renderQueue();
  if(D.t>=D.len)return endDay();
  requestAnimationFrame(tick);
}
function startDay(){
  D={t:0,len:75,running:true,queue:[],deal:null,nextCust:1,asst:8,shown:S.cash,sales:0,spent:0,profit:0,deals:0,newsT:4,sel:null,pendingStory:null};
  CATS.forEach(c=>{S.trend[c.k]=clamp(S.trend[c.k]+rnd(-.12,.12),.55,1.8)});
  $("overlay").hidden=true;
  renderScene();renderPanel();renderHud(1);setNews(summary());
  banner("Day "+S.day);SFX.bell();last=0;requestAnimationFrame(tick);
}
function endDay(){
  D.running=false;D.deal=null;SFX.bell();
  CATS.forEach(c=>{const h=S.hist[c.k];h.push(S.trend[c.k]);if(h.length>30)h.shift()});
  const due=dueTonight(),rentWas=tier().rent,wagesWere=wages();let outcome="paid";
  if(S.cash>=due)S.cash-=due;
  else if(S.tier===0){outcome="covered";S.cash=0}
  else{outcome="evicted";S.cash=0;S.tier--}
  const rec={day:S.day,sales:D.sales,spent:D.spent,rent:rentWas,wages:wagesWere,due,outcome,profit:D.profit,deals:D.deals};
  S.day++;save();
  const after=()=>showEmpire(rec);
  const q=[];if(D.pendingStory)q.push(D.pendingStory);
  if(outcome==="evicted")q.push("evicted");if(outcome==="covered"&&!S.flags.broke){S.flags.broke=1;q.push("broke")}
  if(S.tier===5&&netWorth()>=WIN&&!S.flags.win){S.flags.win=1;q.push("win")}
  save();playStories(q,after);
}
function playStories(keys,done){
  const lines=keys.flatMap(k=>STORY[k]);if(!lines.length)return done();
  let i=0;const o=$("overlay");o.hidden=false;
  const draw=()=>{o.innerHTML=`<div class="sheet story"><div class="who">${avatar(RAY.look,"happy")}<div><span class="eyebrow">Text from</span><br><b>${RAY.name}</b></div></div>
    <div class="bubble">${lines[i]}</div><button class="cta" id="snext">${i<lines.length-1?"Next":"Got it"}${ARROW}</button></div>`;
    $("snext").onclick=()=>{i++;if(i<lines.length)draw();else done()}};
  draw();
}

/* ================= empire screen ================= */
function showEmpire(rec){
  const o=$("overlay");o.hidden=false;
  const draw=(bk)=>{
    const net=rec.sales-rec.spent-(rec.outcome==="paid"?rec.due:0);
    const nx=TIERS[S.tier+1];
    o.innerHTML=`<div class="sheet">
      <h2 class="h2"><small>DAY ${rec.day} · ${tier().n.toUpperCase()}</small>${rec.outcome==="paid"?"Shop closed.":rec.outcome==="covered"?"Ray covered it.":"Evicted."}</h2>
      <div class="stmt">
        <div><span>Sales</span><span class="pos">${fmt(rec.sales)}</span></div>
        <div><span>Purchases</span><span class="neg">${fmt(-rec.spent)}</span></div>
        <div><span>Rent</span><span class="neg">${rec.outcome==="paid"?fmt(-rec.rent):"unpaid"}</span></div>
        ${rec.wages?`<div><span>Wages</span><span class="neg">${rec.outcome==="paid"?fmt(-rec.wages):"unpaid"}</span></div>`:""}
        <div class="tot"><span>Cash flow</span><span class="${net>=0?"pos":"neg"}">${fmt(net)}</span></div>
      </div>
      <div class="grid2">
        <div><span class="eyebrow">Cash</span><b>${fmt(S.cash)}</b></div>
        <div><span class="eyebrow">Net worth</span><b>${fmt(netWorth())}</b></div>
      </div>
      ${nx?`<div class="move"><div class="pv">${sceneSVG(S.tier+1,{})}</div><div class="mb">
        <span class="eyebrow">Next location</span><span class="mt">${nx.n}</span><span class="md">${nx.pitch} Rent ${fmt(nx.rent)}/night · ${nx.slots} slots · ${nx.queue} customers at once.</span>
        <button class="mbtn" id="bMove" ${S.cash>=nx.dep?"":"disabled"}>${S.cash>=nx.dep?"Move in · "+fmt(nx.dep)+" deposit":"Need "+fmt(nx.dep)+" deposit"}</button></div></div>`
       :`<div class="move"><div class="mb"><span class="eyebrow">Empire goal</span><span class="mt">${netWorth()>=WIN?"Resale mogul":"Reach "+fmt(WIN)}</span><span class="md">Net worth ${fmt(netWorth())} of ${fmt(WIN)}.</span></div></div>`}
      <div><div class="sechead"><h3>Staff</h3><span class="eyebrow">Paid nightly</span></div>
      <div class="perks">${STAFF.map(s=>{const has=S.staff[s.k];return `<button class="perk${bk===s.k?" bought":""}" data-staff="${s.k}" ${has||s.hire>S.cash?"disabled":""}>${avatar(s.look,has?"happy":"ok").replace('class="av"','class="av pa"')}
        <span class="t">${s.t}</span><span class="d">${s.d}</span><span class="c">${has?"Hired":fmt(s.hire)}<small>${fmt(s.wage)}/night</small></span></button>`}).join("")}</div></div>
      <div><div class="sechead"><h3>Fixtures</h3><span class="eyebrow">Upgrade your shop</span></div>
      <div class="perks">${FIXTURES.map(f=>{const l=S.fx[f.k],mx=l>=f.max,c=mx?0:f.cost(l);return `<button class="perk nopic${bk===f.k?" bought":""}" data-fx="${f.k}" ${mx||c>S.cash?"disabled":""}>
        <span class="t">${f.t}<span class="pips">${Array.from({length:f.max},(_,j)=>`<i class="${j<l?"on":""}"></i>`).join("")}</span></span><span class="d">${f.d}</span><span class="c">${mx?"Maxed":fmt(c)}</span></button>`}).join("")}</div></div>
      <button class="cta" id="bOpen"><span>Open day ${S.day}<small>Tonight's bill: ${fmt(dueTonight())}</small></span>${ARROW}</button>
    </div>`;
    const keep=y=>{draw(y);};
    o.querySelectorAll("[data-staff]").forEach(b=>b.onclick=()=>{const s=STAFF.find(x=>x.k===b.dataset.staff);if(S.cash<s.hire||S.staff[s.k])return;
      S.cash-=s.hire;S.staff[s.k]=1;SFX.level();save();const y=o.scrollTop;
      if(!S.flags.staff){S.flags.staff=1;playStories(["staff"],()=>{draw(s.k);o.scrollTop=y})}else{draw(s.k);o.scrollTop=y}});
    o.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{const f=FIXTURES.find(x=>x.k===b.dataset.fx),l=S.fx[f.k];if(l>=f.max||S.cash<f.cost(l))return;
      S.cash-=f.cost(l);S.fx[f.k]++;SFX.buy();save();const y=o.scrollTop;draw(f.k);o.scrollTop=y});
    const mv=$("bMove");if(mv)mv.onclick=()=>{if(S.cash<nx.dep)return;S.cash-=nx.dep;S.tier++;SFX.level();buzz([20,40,20]);save();
      const k=tier().k;if(!S.flags[k]){S.flags[k]=1;playStories([k],()=>{draw();o.scrollTop=0})}else{draw();o.scrollTop=0}};
    $("bOpen").onclick=()=>{audioOn();startDay()};
  };
  draw();o.scrollTop=0;
}

/* ================= title ================= */
function title(){
  const o=$("overlay"),has=load();o.hidden=false;let confirmNew=false;
  const draw=()=>{
    o.innerHTML=`<div class="sheet">
      <h1 class="wordmark">Flip<span>Rush</span></h1>
      <p class="lede">From a car trunk to a resale empire. Haggle face to face, grow your shop, and make rent every night.</p>
      <div class="castrow">${CAST.slice(0,7).map(c=>avatar(c.look,"happy")).join("")}</div>
      <div class="howto">
        <div><kbd>TAP</kbd><span>Tap a customer in your shop to start a deal.</span></div>
        <div><kbd>HAGGLE</kbd><span>Slide your offer and counter. Watch their face and patience. Push too far and they walk.</span></div>
        <div><kbd>GROW</kbd><span>Each night, hire staff, buy fixtures and move to a bigger location.</span></div>
      </div>
      ${has?`<button class="cta" id="bCont"><span>Continue<small>Day ${S.day} · ${TIERS[S.tier].n} · ${fmt(S.cash)}</small></span>${ARROW}</button>
        <button class="cta ghost" id="bNew">${confirmNew?"Tap again to erase your empire":"Start a new empire"}</button>`
       :`<button class="cta" id="bNew"><span>Start your empire</span>${ARROW}</button>`}
      <p class="fine">Your empire saves automatically every night.</p></div>`;
    if(has)$("bCont").onclick=()=>{audioOn();startDay()};
    $("bNew").onclick=()=>{audioOn();if(has&&!confirmNew){confirmNew=true;draw();return}
      store.del(SAVE);newGame();S.flags.intro=1;save();playStories(["intro"],startDay)};
  };
  draw();
}

/* ================= fit phones showing the desktop layout ================= */
function fitScreen(){
  root.style.zoom="";root.style.height="";
  const sw=Math.min(screen.width,screen.height)>0&&innerWidth<innerHeight?Math.min(screen.width,screen.height):screen.width;
  if(!matchMedia("(pointer:coarse)").matches||!sw||innerWidth<=sw*1.15)return;
  const z=innerWidth/sw;root.style.zoom=z;root.style.height=(innerHeight/z)+"px";
}
fitScreen();addEventListener("resize",fitScreen);

newGame();S.tier=1;
D={t:20,len:75,running:false,queue:[],deal:null,shown:S.cash,sel:null};
S.stock=[{id:900,cat:"kicks",code:"ZB",name:"Boost Runner 'Zebra'",cond:"DS",base:260,noise:1,paid:150},{id:901,cat:"toys",code:"BF",name:"Bear Figure 400%",cond:"Sealed",base:286,noise:1,paid:190}];
D.queue=[{id:1,cid:"rose",name:"Grandma Rose",look:CAST[0].look,role:"sell",mood:"happy",wait:1,waitMax:1},{id:2,cid:"marcus",name:"Marcus",look:CAST[1].look,role:"buy",mood:"ok",wait:.6,waitMax:1}];
renderScene();updatePatience();renderPanel();renderHud(0);setNews(summary());
title();
})();
